:root{
  --desk:#E7E9F0;
  --page:#FFFFFF;
  --ink:#161A2E;
  --ink-2:#4A5167;
  --ink-3:#7C8399;
  --rule:#DDE0EA;
  --dot:#E2E5EE;
  --cover:#1E2A63;
  --accent:var(--cover);
  --soft:#F2F3F9;
  --good:#0B7A4F;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'Overpass Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@supports (color:color-mix(in srgb,#000 50%,#fff)){
  :root{--soft:color-mix(in srgb,var(--cover) 6%,#fff)}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.55 var(--font);color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--cover) 45%,#fff);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cover colours */
.c-navy{--c:#1E2A63}.c-forest{--c:#0E5F4A}.c-berry{--c:#9B1F4B}
.c-violet{--c:#5236AB}.c-petrol{--c:#0B6477}.c-poppy{--c:#C8371F}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 15px/1 var(--font);padding:13px 20px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cover);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--cover) 88%,#000)}
.btn.line{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--soft)}
.btn.quiet{background:transparent;color:var(--ink-2);padding:10px 12px;font-weight:500}
.btn.quiet:hover{color:var(--ink);background:var(--soft)}
.btn.small{padding:9px 14px;font-size:13.5px}
.btn svg{flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.area{width:100%;background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;font:400 16px/1.5 var(--font);transition:border-color .15s}
.input:hover,.area:hover{border-color:#C4C9D8}
.input:focus,.area:focus{border-color:var(--cover);outline:3px solid color-mix(in srgb,var(--cover) 18%,transparent);outline-offset:0}
.area{resize:vertical;min-height:84px}
::placeholder{color:#A3A9BB}
kbd.ui{font:500 .92em/1.3 var(--font);background:#fff;border:1px solid #C9CEDC;border-bottom-width:2px;border-radius:6px;padding:1px 7px;white-space:nowrap}

/* ---------- first run: the notebook ---------- */
.onb{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}
.onb-left{display:grid;place-items:center;padding:40px 24px;perspective:1800px}
.onb-right{background:var(--page) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/24px 24px;display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,6vw,88px)}
.nb{width:min(340px,64vw);aspect-ratio:10/14;position:relative;border-radius:6px 16px 16px 6px;background:var(--cover);color:#fff;transform-origin:left center;transition:background-color .35s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 34px 60px -34px color-mix(in srgb,var(--cover) 60%,#000),0 2px 6px rgba(22,26,46,.2)}
.nb::before{content:"";position:absolute;inset:0 auto 0 0;width:26px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.07))}
.nb-band{position:absolute;top:-3px;bottom:-3px;right:38px;width:11px;border-radius:3px;background:color-mix(in srgb,var(--cover) 60%,#000);box-shadow:1px 0 0 rgba(255,255,255,.08)}
.nb-label{position:absolute;left:52px;right:70px;top:16%;background:#fff;color:var(--ink);border-radius:4px;padding:13px 15px 15px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.nb-label small{display:block;font-size:11.5px;color:var(--ink-3)}
.nb-label b{display:block;font-size:25px;line-height:1.08;font-weight:600;letter-spacing:-.01em;margin-top:5px;min-height:1.08em;overflow-wrap:anywhere}
.nb-label b.empty{color:#C2C7D6}
.nb-label span{display:block;font-size:12.5px;line-height:1.4;color:var(--ink-2);margin-top:9px;overflow-wrap:anywhere}
.nb-foot{position:absolute;left:52px;right:70px;bottom:26px;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.72)}
.nb-foot b{display:block;color:#fff;font-weight:500}
.onb.opening .nb{transform:rotateY(-108deg);transition:transform .75s cubic-bezier(.6,.04,.3,1)}
.onb.opening{opacity:0;transition:opacity .4s ease .5s}

.q{max-width:560px;width:100%}
.q-count{font-size:14px;color:var(--ink-3)}
.q h1{font-size:clamp(30px,4vw,46px);line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:10px 0 12px;text-wrap:balance}
.q .hint{color:var(--ink-2);font-size:17px;max-width:46ch}
.q .big{display:block;width:100%;margin-top:26px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;padding:8px 0 10px;font:500 clamp(22px,2.7vw,29px)/1.25 var(--font)}
.q textarea.big{resize:none;min-height:2.6em;overflow:hidden;font-size:clamp(20px,2.3vw,25px);line-height:1.3}
.q .big:focus{outline:0;border-bottom-color:var(--cover);box-shadow:0 2px 0 var(--cover)}
.q .two{display:grid;gap:22px;margin-top:8px}
.q label.small{display:block;font-size:14px;color:var(--ink-2);margin-top:26px}
.q label.small + .big{margin-top:2px;font-size:22px}
.swatches{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);cursor:pointer;position:relative}
.swatch[aria-pressed=true]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:24px}
.tile{text-align:left;border:1.5px solid var(--rule);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:#BFC5D6}
.tile[aria-pressed=true]{border-color:var(--cover);box-shadow:0 0 0 3px color-mix(in srgb,var(--cover) 16%,transparent)}
.tile b{display:block;font-weight:600;font-size:17px}
.tile span{display:block;font-size:14px;line-height:1.4;color:var(--ink-2);margin-top:3px}
.q-nav{display:flex;align-items:center;gap:8px;margin-top:34px;flex-wrap:wrap}
.q-nav .grow{flex:1}
.q-dots{display:flex;gap:6px;margin-bottom:22px}
.q-dots i{width:22px;height:3px;border-radius:2px;background:var(--rule)}
.q-dots i.on{background:var(--cover)}
.q .fine{font-size:13.5px;color:var(--ink-3);margin-top:22px;max-width:52ch}
.q-actions{margin-top:22px}
.q .onb-how{margin-top:18px;padding-left:22px;display:grid;gap:7px;color:var(--ink-2);font-size:16px;max-width:52ch}
.q .onb-read{margin-top:18px}
.q .onb-read summary{cursor:pointer;font-weight:500;color:var(--ink-2);font-size:15px}
.q .onb-read .copy{margin-top:10px}
.q .onb-read .copy pre{padding-right:0;max-height:240px}
.q .onb-back{margin-top:22px;font:400 15px/1.6 var(--mono);min-height:7.6em}
.q .onb-got{margin-top:14px;font-size:15px}
.onfile{margin-top:26px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px 20px;max-width:640px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}

/* ---------- the open workbook ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;animation:appin .45s ease both}
@keyframes appin{from{opacity:0}to{opacity:1}}
.side{background:var(--cover);color:#fff;position:sticky;top:0;height:100vh;height:100dvh;padding:20px 16px 18px;display:flex;flex-direction:column;overflow:auto;transition:background-color .35s ease}
.side::before{content:"";position:absolute;inset:0 auto 0 0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.side > *{position:relative}
.plate{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-radius:5px;padding:12px 14px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.28)}
.plate small{display:block;font-size:11.5px;color:var(--ink-3)}
.plate b{display:block;font-size:20px;line-height:1.12;font-weight:600;letter-spacing:-.01em;margin-top:3px;overflow-wrap:anywhere}
.plate span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:12.5px;line-height:1.4;color:var(--ink-2);margin-top:7px}
.nav{display:grid;gap:2px;margin-top:22px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:500;font-size:15.5px}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a[aria-current=page]{background:rgba(255,255,255,.17);color:#fff}
.nav svg{flex:none;opacity:.9}
.side-foot{margin-top:auto;padding-top:22px}
.side-foot p{font-size:13px;color:rgba(255,255,255,.72);margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.24);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:rgba(255,255,255,.8);font:500 14px/1 var(--font);padding:9px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.seg.light{background:var(--soft);display:inline-grid;border:1px solid var(--rule)}
.seg.light button{color:var(--ink-2);padding:10px 18px}
.seg.light button[aria-pressed=true]{background:var(--cover);color:#fff}
.saved{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(255,255,255,.66);margin-top:14px}
.saved i{width:7px;height:7px;border-radius:50%;background:#7CE3B1}

.main{min-width:0;background:var(--page) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/24px 24px;padding:clamp(28px,5vw,60px) clamp(18px,5vw,68px) 120px}
.wrap{max-width:1060px;margin:0 auto}
.head h1{font-size:clamp(32px,4.3vw,52px);line-height:1.04;letter-spacing:-.028em;font-weight:600;max-width:18ch;text-wrap:balance}
.head .lede{font-size:19px;line-height:1.5;color:var(--ink-2);max-width:58ch;margin-top:16px}
.hello{font-size:15px;color:var(--ink-3);margin-bottom:12px}
.sec{margin-top:clamp(44px,6vw,68px)}
.sec > h2{font-size:27px;line-height:1.15;letter-spacing:-.015em;font-weight:600}
.sec > h2 + p{color:var(--ink-2);max-width:62ch;margin-top:8px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px;font-weight:500;margin-bottom:22px}
.back:hover{color:var(--ink)}

/* path on the start page */
.path{list-style:none;padding:0;margin-top:20px;background:#fff;border-top:2px solid var(--ink)}
.path li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--rule)}
.path .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;border:1.5px solid var(--ink);color:var(--ink)}
.path li.done .n{background:var(--good);border-color:var(--good);color:#fff}
.path b{font-weight:600;font-size:18px;line-height:1.25;display:block}
.path em.when{display:block;font-style:normal;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cover);margin-bottom:3px}
.todayskills{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.todayskills.two{max-width:640px}
.todayskills a{display:flex;flex-direction:column;gap:6px;background:#fff;border:1.5px solid var(--rule);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .12s}
.todayskills a:hover{border-color:var(--cover);transform:translateY(-2px)}
.todayskills small{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.todayskills b{font-weight:600;font-size:19px;line-height:1.2}
.todayskills span{color:var(--ink-2);font-size:14.5px;line-height:1.4}
.todayskills i{font-style:normal;font-weight:600;font-size:14.5px;color:var(--cover);margin-top:auto;padding-top:8px}
.mini li b{color:var(--ink);font-weight:600}
.sec .def{font-size:20px;line-height:1.5;max-width:58ch;margin-top:12px}
.tree{margin-top:14px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 20px;max-width:640px}
.tree > b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.tree > b::before{content:"";width:18px;height:14px;border-radius:3px;background:var(--cover)}
.tree > div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:baseline;margin:10px 0 0 26px;padding-top:10px;border-top:1px solid var(--rule)}
.tree span{font:500 14.5px/1.4 var(--mono)}
.tree p{color:var(--ink-2);font-size:14.5px}
.cg{font-size:19px;font-weight:600;margin-top:28px}
.cg + .fine{margin-top:2px}
.conns{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px;max-width:900px}
.conn{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.conn .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.conn .top b{font-weight:600;font-size:17px}
.conn .top small{font-size:12.5px;color:var(--ink-3)}
.conn .can{color:var(--ink-2);font-size:14.5px;margin-top:6px}
.conn > p + p{font-size:15px;margin-top:8px}
.conn details{margin-top:10px}
.conn summary{cursor:pointer;font-weight:600;font-size:14.5px;color:var(--cover)}
.conn .copy{margin-top:10px}
.conn .may{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 0}
.conn .may dt{font-weight:600;font-size:13.5px}
.conn .may dd{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.path span{display:block;color:var(--ink-2);font-size:15px;margin-top:2px}

/* anatomy */
.anatomy{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,44px);margin-top:24px;align-items:start}
.notes{list-style:none;padding:0;display:grid;gap:18px}
.notes li{display:grid;grid-template-columns:30px 1fr;gap:12px}
.notes .k,.sheet .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cover);color:#fff;font:600 12px/1 var(--font)}
.notes b{display:block;font-weight:600}
.notes p{color:var(--ink-2);font-size:15.5px;margin-top:2px}

/* paper sheet with a file on it */
.file{min-width:0}
.file-tab{display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--mono);background:#fff;border:1px solid var(--rule);border-bottom:0;border-radius:6px 6px 0 0;padding:8px 12px;color:var(--ink-2)}
.sheet{background:#fff;border:1px solid var(--rule);border-radius:0 6px 6px 6px;font:400 12.75px/1.7 var(--mono);padding:18px 20px;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:560px;box-shadow:0 22px 44px -32px rgba(22,26,46,.4)}
.sheet .fm{color:var(--accent)}
.sheet .h{font-weight:700}
.sheet mark{background:color-mix(in srgb,var(--cover) 13%,#fff);color:inherit;border-radius:3px;padding:0 2px}
.sheet .k{margin-right:6px;vertical-align:1px}
.sheet.short{max-height:none}

/* library */
.group{margin-top:clamp(40px,5vw,60px)}
.group h2{font-size:25px;line-height:1.15;letter-spacing:-.015em;font-weight:600}
.group > p{color:var(--ink-2);max-width:62ch;margin-top:6px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:34px 24px;margin-top:24px}
.vol{display:block;text-decoration:none;color:inherit;min-width:0}
.book{display:flex;flex-direction:column;aspect-ratio:3/4;border-radius:4px 12px 12px 4px;background:var(--c);color:#fff;position:relative;padding:18px 16px 16px 28px;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 26px -18px color-mix(in srgb,var(--c) 70%,#000)}
.book::before{content:"";position:absolute;inset:0 auto 0 0;width:13px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.06))}
.vol:hover .book,.vol:focus-visible .book{transform:translateY(-5px) rotate(-.7deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 26px 30px -20px color-mix(in srgb,var(--c) 70%,#000)}
.book svg.mark{width:46px;height:46px}
.book .t{font-size:21px;line-height:1.1;font-weight:600;letter-spacing:-.01em;margin-top:auto}
.book .for{align-self:flex-start;max-width:100%;margin-top:12px;background:#fff;color:var(--ink);font-size:11.5px;line-height:1.2;font-weight:500;padding:4px 8px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book .got{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center}
.book.blank{background:#fff;color:var(--ink);border:1.5px dashed #B9BFD0;box-shadow:none}
.book.blank::before{display:none}
.vol:hover .book.blank{box-shadow:none;border-color:var(--ink)}
.vol p{font-size:14px;line-height:1.42;color:var(--ink-2);margin-top:13px}
.vol .tag{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:12px}
.vol .tag + p{margin-top:3px}
.shelf.wide{grid-template-columns:repeat(auto-fill,minmax(150px,190px))}

/* a skill's page */
.skill{display:grid;grid-template-columns:minmax(210px,270px) minmax(0,1fr);gap:clamp(26px,5vw,60px);align-items:start}
.skill-side{position:sticky;top:26px}
.skill-side .book{max-width:270px}
.skill-side .book .t{font-size:27px}
.skill-side .book svg.mark{width:58px;height:58px}
.facts dt{font-size:13px;color:var(--ink-3);margin-top:18px}
.facts dd{font-size:15px;line-height:1.45;margin-top:3px}
.facts ul{padding-left:18px;margin:0}
.facts li{margin-top:3px}
.skill-main h1{font-size:clamp(30px,3.8vw,44px);line-height:1.06;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.skill-main .lede{font-size:18.5px;color:var(--ink-2);margin-top:12px;max-width:56ch}
.tagline{font-size:13.5px;font-weight:600;color:var(--accent);margin-bottom:10px}
.do{list-style:none;padding:0;margin-top:30px;background:#fff;border:1px solid var(--rule);border-radius:16px}
.do > li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:16px;padding:24px 24px 26px;border-bottom:1px solid var(--rule)}
.do > li:last-child{border-bottom:0}
.do .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;border:1.5px solid var(--ink)}
.do > li.done .n{background:var(--good);border-color:var(--good);color:#fff}
.do h2{font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.01em;padding-top:3px}
.do h2 + p,.do .say{color:var(--ink-2);margin-top:6px;max-width:60ch}
.do .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.do details{margin-top:14px}
.do summary{cursor:pointer;font-weight:500;color:var(--ink-2);font-size:15px}
.do summary:hover{color:var(--ink)}
.do details[open] summary{margin-bottom:10px}
.clicks{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;margin-top:14px}
.clicks kbd{font:500 14.5px/1.2 var(--font);background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:6px 11px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.clicks i{font-style:normal;color:var(--ink-3);padding:0 1px}
.fine{font-size:14px;color:var(--ink-2);margin-top:12px;max-width:62ch}
.copy{position:relative;background:var(--soft);border-radius:10px;padding:14px 16px;margin-top:14px}
.copy pre{margin:0;font:400 13.25px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;padding-right:74px;max-height:260px;overflow:auto}
.copy .btn{position:absolute;top:9px;right:9px;background:#fff;border-color:var(--rule)}
.tick{display:flex;gap:11px;align-items:flex-start;margin-top:16px;cursor:pointer;font-weight:500}
.tick input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;margin:1px 0 0;cursor:pointer;display:grid;place-items:center}
.tick input:checked{background:var(--good);border-color:var(--good)}
.tick input:checked::after{content:"";width:10px;height:6px;border-left:2.2px solid #fff;border-bottom:2.2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.test{border-top:1px solid var(--rule);margin-top:20px;padding-top:18px}
.test h3{font-size:16.5px;font-weight:600}
.expect{font-size:15px;margin-top:12px;padding-left:14px;border-left:3px solid var(--good);color:var(--ink)}
.expect b{font-weight:600}
.stops{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px}
.stops li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.stops svg{margin-top:3px;color:var(--accent)}

/* write your own */
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:clamp(24px,4vw,48px);align-items:start;margin-top:34px}
.maker-side{position:sticky;top:24px}
.ask{padding:24px 0;border-bottom:1px solid var(--rule)}
.ask:first-child{padding-top:0}
.ask label,.ask .lab{display:block;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.ask .hint{color:var(--ink-2);font-size:15px;margin-top:4px;max-width:56ch}
.ask .input,.ask .area{margin-top:12px}
.ask .slug{font-size:13.5px;color:var(--ink-3);margin-top:8px}
.ask .slug code{font:500 13px var(--mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px/1.2 var(--font);cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s}
.chip:hover{border-color:#B9BFD0}
.chip[aria-pressed=true]{background:var(--cover);border-color:var(--cover);color:#fff}
.starters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.starters span{font-size:14.5px;color:var(--ink-2);margin-right:4px}
.maker-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px}
.count{font-size:13px;color:var(--ink-3);margin-top:10px}
.count b{color:var(--ink-2);font-weight:600}

/* ---------- what a skill is, what is inside, how to change it ---------- */
.what .def{font-size:20px;line-height:1.5;max-width:58ch;margin-top:12px}
.what .vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px;max-width:760px}
.what .vs > div{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.what .vs > div.on{border-color:var(--cover);box-shadow:inset 3px 0 0 var(--cover)}
.what .vs b{font-weight:600;font-size:17px}
.what .vs p{color:var(--ink-2);font-size:15px;margin-top:4px}
.what .uses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px;margin-top:20px;max-width:760px}
.what .uses dt{font-weight:600;font-size:15px}
.what .uses dd{color:var(--ink-2);font-size:15px;margin:2px 0 0}
.what .tools{display:grid;gap:6px;margin:12px 0 0;max-width:640px}
.what .tools > div{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:12px;align-items:baseline;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 14px}
.what .tools > div.w{background:#FBF5F4;border-color:#EFD9D5}
.what .tools dt{font:500 13.5px/1.5 var(--mono);overflow-wrap:anywhere}
.what .tools dd{margin:0;color:var(--ink-2);font-size:14.5px}
.made{margin-top:26px;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:22px 24px}
.made h2{font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.made > p{color:var(--ink-2);font-size:15px;margin-top:4px;max-width:62ch}
.made dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px;margin:18px 0 0}
.made dt{font-size:13px;font-weight:600;color:var(--accent)}
.made dd{margin:3px 0 0;font-size:14.5px;color:var(--ink-2)}
.made ul,.made ol{margin:0;padding-left:18px}
.made li + li{margin-top:2px}
.made .wait{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:12.5px;font-weight:600;color:var(--accent)}
.made .wait svg{width:14px;height:14px}
.inside{margin-top:14px;background:var(--soft);border-radius:10px;padding:12px 16px}
.inside p{font-size:14.5px;color:var(--ink-2)}
.inside b{color:var(--ink);font-weight:600}
.inside pre{margin:8px 0 0;font:500 13px/1.6 var(--mono);color:var(--ink);white-space:pre-wrap}
.inside pre span{color:var(--ink-3);font-weight:400}
.ways{margin-top:14px;border-top:1px solid var(--rule)}
.ways > div{display:grid;grid-template-columns:128px minmax(0,1fr);gap:4px 16px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.ways b{font-weight:600;font-size:15.5px}
.ways p,.ways .btn{grid-column:2}
.ways p{color:var(--ink-2);font-size:14.5px;max-width:56ch}
.ways .btn{justify-self:start;margin-top:4px}
@media (max-width:860px){
  .what .vs,.what .uses,.made dl,.ways > div{grid-template-columns:1fr}
  .what .tools > div{grid-template-columns:1fr;gap:2px}
  .ways p,.ways .btn{grid-column:1}
  .made{padding:18px 16px}
}

/* ---------- chapter strip, Files and tools ---------- */
.sessions{display:flex;gap:8px;overflow-x:auto;margin:0 0 30px;padding:2px 2px 6px}
.sessions a{flex:none;min-width:150px;display:block;padding:10px 14px;background:#fff;border:1.5px solid var(--rule);border-radius:12px;color:var(--ink);text-decoration:none}
.sessions a:hover{border-color:#C4C9D8}
.sessions a[aria-current]{border-color:var(--cover);box-shadow:inset 0 -3px 0 var(--cover)}
.sessions a.soon{background:transparent;border-style:dashed}
.sessions b{display:block;font-weight:600;font-size:15px}
.sessions span{display:block;font-size:13px;color:var(--ink-2);margin-top:1px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px;max-width:880px}
.trio > div{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.trio > div.on{border-color:var(--cover);box-shadow:inset 3px 0 0 var(--cover)}
.trio b{display:block;font-weight:600;font-size:17px}
.trio span{display:block;font-size:13px;font-weight:600;color:var(--accent);margin-top:2px}
.trio p{color:var(--ink-2);font-size:15px;margin-top:6px}
.leave{margin-top:18px;max-width:62ch;color:var(--ink-2)}
.leave b{color:var(--ink);font-weight:600}
.ready{margin-top:28px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;display:grid;gap:10px;max-width:880px}
.ready label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.ready select{max-width:420px}
.ready p{color:var(--ink-2);font-size:15px;display:flex;gap:8px;align-items:flex-start}
.ready p svg{color:var(--good);flex:none;margin-top:3px}
.deliver{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;max-width:880px}
.deliver > div{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.deliver > div.done{border-color:var(--good)}
.deliver b{font-weight:600;font-size:16px}
.deliver .by{color:var(--ink-2);font-size:14.5px;margin-top:4px}
.deliver .tick{margin-top:10px}
@media (max-width:860px){.deliver{grid-template-columns:1fr}}
.do .why{margin-top:8px;max-width:60ch;padding-left:12px;border-left:3px solid var(--cover);color:var(--ink);font-size:15.5px}
.do .why b{font-weight:600}
.s2 .field{margin-top:16px;max-width:640px}
.s2 .field label{display:block;font-weight:600;font-size:15.5px}
.s2 .field .hint{color:var(--ink-2);font-size:14px;margin-top:2px}
.s2 .field .input,.s2 .field .area{margin-top:8px}
.s2 .field .hint svg{color:var(--good);vertical-align:-3px}
.facts5{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin:16px 0 0;max-width:640px}
.facts5 dt{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.facts5 dd{margin:1px 0 0;font-size:14.5px;color:var(--ink-2)}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.pick > div{border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.pick > div.no{background:#FBF5F4;border-color:#EFD9D5}
.pick b{font-weight:600;font-size:15px}
.pick ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:14.5px}
.mini{margin:12px 0 0;padding-left:20px;color:var(--ink-2);font-size:15px;display:grid;gap:6px;max-width:60ch}
.s2 .test > p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.opt{margin-top:26px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 20px;max-width:880px}
.opt summary{cursor:pointer;font-weight:600}
.opt p{color:var(--ink-2);font-size:15px;margin-top:10px;max-width:62ch}
.have{list-style:none;padding:0;margin-top:14px;display:grid;gap:10px;max-width:640px}
.have li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;color:var(--ink-2)}
.have li > span{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;margin-top:1px}
.have li.ok{color:var(--ink)}
.have li.ok > span{background:var(--good);border-color:var(--good);color:#fff}
.have li.note > span{border-style:dashed}
.parts{display:grid;gap:10px;margin:14px 0 0;max-width:680px}
.parts > div{border-left:3px solid var(--rule);padding-left:12px}
.parts dt{font:500 13.5px/1.55 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.parts dd{margin:2px 0 0;color:var(--ink-2);font-size:14.5px}
.runlog{display:grid;gap:12px;margin-top:14px;max-width:680px}
.runlog > div{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.runlog b{font-weight:600}
.runlog select{max-width:240px}
.s3 .field{margin-top:16px;max-width:640px}
.s3 .field label{display:block;font-weight:600;font-size:15.5px}
.s3 .field .hint{color:var(--ink-2);font-size:14px;margin-top:2px}
.s3 .field .input{margin-top:8px}
.trio.four{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1000px}
.s4 .field{margin-top:16px;max-width:640px}
.s4 .field label{display:block;font-weight:600;font-size:15.5px}
.s4 .field .hint{color:var(--ink-2);font-size:14px;margin-top:2px}
.s4 .field .input{margin-top:8px}
.fixes dt{font-family:inherit;font-weight:600;font-size:15px;line-height:1.4}
.fixes > div.on{border-left-color:var(--cover);background:#fff;border-radius:0 10px 10px 0;padding:8px 12px}
.fixes .row{margin-top:8px}
.trust{display:grid;gap:8px;margin-top:14px;max-width:700px}
.trust > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 14px}
.trust > div.fixed{background:var(--soft)}
.trust b{font-weight:500;font-size:15px}
.trust .seg{display:inline-flex;justify-self:start;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:#fff}
.trust .seg label{position:relative;cursor:pointer}
.trust .seg label + label{border-left:1px solid var(--rule)}
.trust .seg input{position:absolute;opacity:0;width:1px;height:1px}
.trust .seg span{display:block;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.trust .seg input:checked + span{color:#fff;background:var(--ink)}
.trust .seg input[value="alone"]:checked + span{background:var(--good)}
.trust .seg input[value="ask"]:checked + span{background:#A16207}
.trust .seg input[value="never"]:checked + span{background:#9F2D2D}
.trust .seg input:focus-visible + span{outline:2px solid var(--cover);outline-offset:-3px}
.trust .seg input:disabled + span{opacity:.35;cursor:not-allowed}
@media (max-width:1180px){.trio.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.s3 .field .hint svg{color:var(--good);vertical-align:-3px}
.s3 .opt{margin-top:18px;max-width:640px}
.s3 .opt .field{margin-top:12px}
@media (max-width:860px){
  .trio,.pick,.facts5{grid-template-columns:1fr}
  .trio.four{grid-template-columns:1fr}
  .trust > div{grid-template-columns:1fr;gap:8px}
}

/* ---------- write a skill: why each answer matters ---------- */
.ask .into{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.ask .into span{display:inline-block;margin-left:4px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent)}
.ask .why{font-size:15px;color:var(--ink);margin-top:10px;max-width:60ch;padding-left:12px;border-left:3px solid var(--cover)}
.ask .why b{font-weight:600}
.ask .eg{font-size:14px;color:var(--ink-2);margin-top:8px;max-width:60ch;line-height:1.9}
.ask .eg span{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.ask .eg .weak{background:#F6E7E5;color:#8A2D22}
.ask .eg .strong{background:#E3F2EA;color:#0B6B45;margin-left:14px}
.ask .try{font-size:14px;color:var(--ink-2);margin-top:10px;max-width:60ch}
.ask .try b{color:var(--ink);font-weight:600}
.ask.main{background:var(--soft);border:1px solid var(--rule);border-radius:12px;padding:22px 20px;margin:14px 0}
.ask.main .into span{background:#fff}
.sheet.secs{position:relative}
.sheet.secs .ln{display:block;margin:0 -10px;padding:0 10px;border-radius:4px;transition:background-color .15s,box-shadow .15s}
.sheet[data-on="job"] .ln[data-sec~="job"],
.sheet[data-on="name"] .ln[data-sec~="name"],
.sheet[data-on="when"] .ln[data-sec~="when"],
.sheet[data-on="needs"] .ln[data-sec~="needs"],
.sheet[data-on="steps"] .ln[data-sec~="steps"],
.sheet[data-on="output"] .ln[data-sec~="output"],
.sheet[data-on="checks"] .ln[data-sec~="checks"],
.sheet[data-on="rules"] .ln[data-sec~="rules"],
.sheet[data-on="purpose"] .ln[data-sec~="purpose"],
.sheet[data-on="inputs"] .ln[data-sec~="inputs"],
.sheet[data-on="method"] .ln[data-sec~="method"],
.sheet[data-on="donts"] .ln[data-sec~="donts"],
.sheet[data-on="examples"] .ln[data-sec~="examples"],
.sheet[data-on="extras"] .ln[data-sec~="extras"],
.sheet[data-on="venture"] .ln[data-sec~="venture"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--cover)}
@supports (color:color-mix(in srgb,#000 50%,#fff)){
  .sheet[data-on] .ln[data-sec]{--lit:color-mix(in srgb,var(--cover) 11%,#fff)}
  .sheet[data-on="job"] .ln[data-sec~="job"],
  .sheet[data-on="name"] .ln[data-sec~="name"],
  .sheet[data-on="when"] .ln[data-sec~="when"],
  .sheet[data-on="needs"] .ln[data-sec~="needs"],
  .sheet[data-on="steps"] .ln[data-sec~="steps"],
  .sheet[data-on="output"] .ln[data-sec~="output"],
  .sheet[data-on="checks"] .ln[data-sec~="checks"],
  .sheet[data-on="rules"] .ln[data-sec~="rules"],
  .sheet[data-on="purpose"] .ln[data-sec~="purpose"],
  .sheet[data-on="inputs"] .ln[data-sec~="inputs"],
  .sheet[data-on="method"] .ln[data-sec~="method"],
  .sheet[data-on="donts"] .ln[data-sec~="donts"],
  .sheet[data-on="examples"] .ln[data-sec~="examples"],
  .sheet[data-on="extras"] .ln[data-sec~="extras"],
  .sheet[data-on="venture"] .ln[data-sec~="venture"]{background:var(--lit)}
}

/* ---------- a published skill, part by part ---------- */
.built .sheet{max-height:480px}
.built .file{margin-top:12px}
.partchips{margin-top:14px}
.partnote{margin-top:12px;padding-left:12px;border-left:3px solid var(--cover);font-size:15px;color:var(--ink-2);max-width:66ch;min-height:2.9em}
.partnote b{color:var(--ink);font-weight:600}
.heed{margin-top:16px;max-width:62ch;padding:12px 16px;border-radius:10px;background:#FBF5F4;border:1px solid #EFD9D5;font-size:15px}
.heed b{font-weight:600}
.do details.sub{margin:8px 0 0 14px}
.do details.sub summary{font:500 13.5px/1.5 var(--mono)}
.uses.field dt{font-size:19px;letter-spacing:-.01em}
.credits ul{margin:16px 0 0;padding-left:20px;display:grid;gap:6px;max-width:74ch;font-size:15px}
.credits code{font:500 13px var(--mono)}
.credits .faq{max-width:74ch;margin-top:18px}
pre.lic{margin:10px 0 0;font:400 12px/1.6 var(--mono);white-space:pre-wrap;color:var(--ink-2);max-height:260px;overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.starters .chip[aria-pressed=true]{background:var(--cover);border-color:var(--cover);color:#fff}

/* manual */
.manual-top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;margin-top:26px}
.manual-top span{color:var(--ink-2);font-size:15px}
.chapter{margin-top:clamp(36px,5vw,56px);background:#fff;border:1px solid var(--rule);border-radius:16px;padding:clamp(22px,3vw,34px)}
.chapter h2{font-size:25px;line-height:1.15;letter-spacing:-.015em;font-weight:600}
.chapter > p{color:var(--ink-2);margin-top:8px;max-width:64ch}
.steps{list-style:none;padding:0;margin-top:20px;counter-reset:s;display:grid;gap:0}
.steps > li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.steps > li::before{content:counter(s);width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:600;font-size:14.5px}
.steps p{max-width:62ch}
.steps p + p{margin-top:8px;color:var(--ink-2);font-size:15px}
.steps .clicks{margin-top:10px}
.faq{margin-top:14px}
.faq details{border-top:1px solid var(--rule);padding:14px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:16.5px}
.faq details p{color:var(--ink-2);margin-top:8px;max-width:64ch}
.sources{font-size:14px;color:var(--ink-2);margin-top:26px;max-width:70ch}
.sources a{overflow-wrap:anywhere}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.toc a{font-size:14px;font-weight:500;text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--rule);border-radius:999px;padding:7px 13px}
.toc a:hover{border-color:var(--ink)}

/* my venture */
.form{display:grid;gap:18px;max-width:640px;margin-top:22px;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:clamp(20px,3vw,30px)}
.form label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.mine{list-style:none;padding:0;margin-top:20px;background:#fff;border-top:2px solid var(--ink)}
.mine li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--rule)}
.mine a{font-weight:600;font-size:17px;color:var(--ink);text-decoration:none}
.mine a:hover{text-decoration:underline;text-underline-offset:3px}
.mine .st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink-2)}
.pill.on{background:color-mix(in srgb,var(--good) 14%,#fff);color:var(--good)}
.empty{background:#fff;border:1.5px dashed #B9BFD0;border-radius:14px;padding:22px;color:var(--ink-2);margin-top:20px;max-width:640px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-weight:500;font-size:14.5px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:80px;font-size:13px;color:var(--ink-3)}

/* ---------- smaller screens ---------- */
@media (max-width:1020px){
  .maker{grid-template-columns:1fr}
  .maker-side{position:static}
}
@media (max-width:860px){
  .onb{grid-template-columns:1fr}
  .onb-left{padding:28px 20px 6px}
  .nb{width:min(210px,52vw)}
  .nb-label{left:36px;right:48px;padding:9px 10px 10px}
  .nb-label b{font-size:17px}
  .nb-label span,.nb-foot{display:none}
  .nb-band{right:24px;width:8px}
  .nb::before{width:18px}
  .onb-right{justify-content:flex-start;padding:26px 20px 40px}
  .app{grid-template-columns:1fr;padding-bottom:64px}
  .side{position:static;height:auto;padding:12px 14px;flex-direction:row;align-items:center;gap:12px;overflow:visible}
  .side::before{display:none}
  .plate{flex:1;min-width:0;padding:8px 11px 9px}
  .plate small,.plate span{display:none}
  .plate b{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot{margin:0;padding:0;flex:none}
  .side-foot p,.saved{display:none}
  .seg button{padding:8px 10px;font-size:13px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;grid-template-columns:repeat(5,1fr);gap:0;background:var(--cover);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .nav a{flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;text-align:center;line-height:1.1}
  .anatomy,.skill{grid-template-columns:1fr}
  .skill-main{order:1}
  .skill-side{order:2;position:static;display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:start;border-top:1px solid var(--rule);padding-top:24px}
  .skill-side .book .t{font-size:16px}
  .skill-side .book{padding:12px 10px 10px 20px}
  .skill-side .book svg.mark{width:34px;height:34px}
  .skill-side .book .for{display:none}
  .facts dt:first-child{margin-top:0}
  .do > li{grid-template-columns:1fr;padding:20px 16px}
  .path li{grid-template-columns:36px minmax(0,1fr)}
  .path li .btn{grid-column:2;justify-self:start}
  .tiles{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px}
  .mine li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  .side,.toast{display:none}
  .app{display:block}
  .main{background:#fff;padding:0}
}

.book.conn{background:var(--c)}
.book.conn svg.logo{width:44px;height:44px;fill:#fff}
.skill-side .book.conn{color:#fff}
.book.conn .for{background:rgba(255,255,255,.92)}
.may{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 0;max-width:640px}
.may > div{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:12px 16px}
.may dt{font-weight:600;font-size:15px}
.may dd{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}

.who{display:inline-block;vertical-align:2px;margin-left:6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--ink-2);border:1px solid var(--rule)}
.who.you{background:var(--cover);border-color:var(--cover);color:#fff}
.who.all{background:#fff}
h2 .who{font-size:12px}
.role{margin-top:14px;color:var(--ink-2);font-size:15px}
.role .linkbtn{margin-left:4px}

.now{display:block;margin-top:7px;font-weight:600;font-size:14px}
.now.go{color:var(--good)}
.now.go::before{content:"\25B6\00a0";font-size:11px}
.now.wait{color:#B45309}
.now.wait::before{content:"\23F3\00a0"}
.now.later{color:var(--ink-3);font-weight:500}
.now.done{color:var(--good);display:inline-flex;align-items:center;gap:4px}
.now.done svg{width:14px;height:14px}
p.now{margin-top:10px}

.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.tiles.three{grid-template-columns:1fr}}

const REAL = {"startup-idea-validator": {"author": "Mohit Aggarwal", "license": "MIT", "repo": "mohitagw15856/pm-claude-skills", "path": "skills/startup-idea-validator", "commit": "d11af08fd758f1d25e98b16b08a4d99cea54b980", "url": "https://github.com/mohitagw15856/pm-claude-skills/tree/d11af08fd758f1d25e98b16b08a4d99cea54b980/skills/startup-idea-validator", "files": {"SKILL.md": "---\nname: startup-idea-validator\ndescription: \"Pressure-test a startup idea the way a sharp investor or co-founder would — problem, market, wedge, moat, why-now, and the fastest cheap way to test it. Use when asked to validate a startup idea, evaluate a business idea, stress-test a concept, or decide whether something is worth building. Produces an honest assessment with the strongest case, the killer risks, and the next experiment to run — not cheerleading.\"\n---\n\n# Startup Idea Validator Skill\n\nMost ideas die from one fatal flaw the founder won't see. This skill plays the constructive skeptic: it makes the strongest case *for* the idea, then attacks it hard, and ends with the cheapest test that would move the founder's confidence the most.\n\n## Working from a brief\n\nGiven a one-line idea, **deliver the full assessment anyway** — infer the market and model, and mark assumptions. Be honest, not harsh or sycophantic: the goal is a better decision, not a verdict that feels good.\n\n## Required Inputs\n\nAsk for (if not already provided):\n- **The idea** — what it is and who it's for\n- **The problem** it solves and how people cope today\n- **Why the founder** is drawn to it (context for founder-market fit)\n- **Stage** — just an idea, a prototype, early users?\n\n## Output Format\n\n### 1. Steel-man — the strongest case for\nThe most compelling version of why this could be big. Take it seriously.\n\n### 2. Scorecard\n\n| Dimension | Read | Notes |\n|---|---|---|\n| Problem (real & painful?) | 🟢/🟡/🔴 | |\n| Market (big & reachable?) | 🟢/🟡/🔴 | |\n| Wedge (sharp entry point?) | 🟢/🟡/🔴 | |\n| Why-now (what changed?) | 🟢/🟡/🔴 | |\n| Moat (defensible over time?) | 🟢/🟡/🔴 | |\n| Distribution (can you reach buyers cheaply?) | 🟢/🟡/🔴 | |\n\n### 3. The killer risks\nThe 2–3 things most likely to kill this. Be specific — name the assumption that, if false, ends it.\n\n### 4. Closest competitors / why-not-already\nWho's near this, and the honest answer to \"if this is a good idea, why doesn't it exist / why hasn't [incumbent] done it?\"\n\n### 5. The next experiment\nThe single cheapest, fastest test that would most change your confidence — what to do this week, and what result would be a green vs red light.\n\n### 6. Verdict\n*Promising / Promising-with-conditions / Reconsider* — with the one sentence that decides it.\n\n## Quality Checks\n\n- [ ] Steel-mans the idea before critiquing it\n- [ ] Names specific killer assumptions, not generic \"execution risk\"\n- [ ] Answers \"why doesn't this already exist?\"\n- [ ] Ends with a concrete, cheap, this-week experiment\n\n## Anti-Patterns\n\n- Cheerleading (validating because the founder wants a yes)\n- Generic critique that applies to any startup\n- Recommending a 6-month build as the \"test\"\n- A verdict with no path forward\n"}}, "prioritize-assumptions": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-product-discovery/skills/prioritize-assumptions", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-product-discovery/skills/prioritize-assumptions", "files": {"SKILL.md": "---\nname: prioritize-assumptions\ndescription: \"Prioritize assumptions using an Impact × Risk matrix and suggest experiments for each. Use when triaging a list of assumptions, deciding what to test first, or applying the assumption prioritization canvas.\"\n---\n\n## Prioritize Assumptions\n\nTriage assumptions using an Impact × Risk matrix and suggest targeted experiments.\n\n### Context\n\nYou are helping prioritize assumptions for **$ARGUMENTS**.\n\nIf the user provides files with assumptions or research data, read them first.\n\n### Domain Context\n\n**ICE** works well for assumption prioritization: Impact (Opportunity Score × # Customers) × Confidence (1–10) × Ease (1–10). Opportunity Score = Importance × (1 − Satisfaction), normalized to 0–1 (Dan Olsen). **RICE** splits Impact into Reach × Impact separately: (R × I × C) / E. See the `prioritization-frameworks` skill for full formulas and templates.\n\n### Instructions\n\nThe user will provide a list of assumptions to prioritize. Apply the following framework:\n\n1. **For each assumption**, evaluate two dimensions:\n   - **Impact**: The value created by validating this assumption AND the number of customers affected (in ICE: Impact = Opportunity Score × # Customers)\n   - **Risk**: Defined as (1 - Confidence) × Effort\n\n2. **Categorize each assumption** using the Impact × Risk matrix:\n   - **Low Impact, Low Risk** → Defer testing until higher-priority assumptions are addressed\n   - **High Impact, Low Risk** → Proceed to implementation (low risk, high reward)\n   - **Low Impact, High Risk** → Reject the idea (not worth the investment)\n   - **High Impact, High Risk** → Design an experiment to test it\n\n3. **For each assumption requiring testing**, suggest an experiment that:\n   - Maximizes validated learning with minimal effort\n   - Measures actual behavior, not opinions\n   - Has a clear success metric and threshold\n\n4. **Present results** as a prioritized matrix or table.\n\nThink step by step. Save as markdown if the output is substantial.\n\n---\n\n### Further Reading\n\n- [Assumption Prioritization Canvas: How to Identify And Test The Right Assumptions](https://www.productcompass.pm/p/assumption-prioritization-canvas)\n- [Continuous Product Discovery Masterclass (CPDM)](https://www.productcompass.pm/p/cpdm) (video course)\n"}}, "brainstorm-experiments-new": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-product-discovery/skills/brainstorm-experiments-new", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-product-discovery/skills/brainstorm-experiments-new", "files": {"SKILL.md": "---\nname: brainstorm-experiments-new\ndescription: \"Design lean startup experiments (pretotypes) for a new product. Creates XYZ hypotheses and suggests low-effort validation methods like landing pages, explainer videos, and pre-orders. Use when validating a new product idea, creating pretotypes, or testing market demand.\"\n---\n\n## Design Lean Startup Experiments (New Product)\n\nCreate XYZ hypotheses and design pretotype experiments to validate a new product concept with minimal effort.\n\n### Context\n\nYou are helping validate a new product concept: **$ARGUMENTS** using lean startup methodology.\n\nIf the user provides files (market research, landing page mockups), read them first.\n\n### Instructions\n\n1. **Create an XYZ Hypothesis** in the form: \"At least X% of Y will do Z\"\n   - **X%**: The percentage of the target market expected to engage\n   - **Y**: The specific target market (e.g., \"mid-size luxury sedan buyers\")\n   - **Z**: How they will engage with the product\n\n2. **Suggest 2-3 pretotype experiments** to test the hypothesis with minimal effort. Consider:\n   - **Landing Page**: Test interest by measuring sign-ups or clicks\n   - **Explainer Video**: Test understanding and appeal through engagement metrics\n   - **Email Campaign**: Test demand through response and click-through rates\n   - **Pre-Order / Waitlist**: Test willingness to pay through skin-in-the-game commitment\n   - **Concierge / Manual MVP**: Deliver the service manually to test value\n\n3. **Key principles** (Alberto Savoia, *The Right It*):\n   - **Skin-in-the-Game**: Test willingness to pay — not just interest. Real commitment (time, money, reputation) is the only reliable signal.\n   - **Your Own Data (YODA)**: Collect your own data through experiments rather than relying on Others' Data (ODP) like market reports or analogies. \"The market for your idea does not care about the market for someone else's idea.\"\n   - Measure actual behavior, not users' opinions\n\n4. **For each experiment**, specify the hypothesis being tested, the method, the metric, and the success threshold.\n\nThink step by step. Save as markdown if substantial.\n\n---\n\n### Further Reading\n\n- [How to Build the Right Product with Alberto Savoia (ex-Innovator at Google)](https://www.productcompass.pm/p/how-to-build-the-right-product-with)\n- [Testing Product Ideas: The Ultimate Validation Experiments Library](https://www.productcompass.pm/p/the-ultimate-experiments-library)\n- [Continuous Product Discovery Masterclass (CPDM)](https://www.productcompass.pm/p/cpdm) (video course)\n"}}, "experiment-designer": {"author": "Mohit Aggarwal", "license": "MIT", "repo": "mohitagw15856/pm-claude-skills", "path": "skills/experiment-designer", "commit": "d11af08fd758f1d25e98b16b08a4d99cea54b980", "url": "https://github.com/mohitagw15856/pm-claude-skills/tree/d11af08fd758f1d25e98b16b08a4d99cea54b980/skills/experiment-designer", "files": {"SKILL.md": "---\nname: experiment-designer\ndescription: \"Design statistically rigorous A/B tests and interpret experiment results. Use when asked to design an experiment, run an A/B test, calculate sample size, interpret test results, or assess whether an experiment was successful. Produces a complete experiment design with hypothesis, sample size, run time, success criteria, and risk flags — or a results interpretation with ship/iterate/kill recommendation.\"\n---\n\n# Experiment Designer Skill\n\nProduce rigorous experiment designs from product hypotheses, and interpret results with statistical and practical significance — so you can defend every decision to a sceptical engineering lead or data scientist.\n\n## Required Inputs\n\nAsk the user for these if not provided:\n**For experiment design:**\n- Hypothesis (what change, what metric, what expected movement)\n- Current baseline metric value\n- Minimum detectable effect (MDE) — the smallest lift worth caring about\n- Available daily sample size\n\n**For results interpretation:**\n- Control and variant results (raw numbers or percentages)\n- P-value or confidence interval\n- Run duration (days)\n- Any anomalies observed during the test\n\n## Two-Phase Process\n\n### Phase 1: Experiment Design\n1. Restate hypothesis as: \"If we [change], we expect [metric] to [move by X%] because [reason]\"\n2. Define control and variant clearly\n3. Select primary metric (one only) and secondary guardrail metrics (2-3 max)\n4. Calculate required sample size from MDE and baseline\n5. Estimate run time in days\n6. Set pre-defined success criteria before the test runs — no moving goalposts\n7. Flag design risks: novelty effects, seasonal confounds, multiple testing issues, network effects, sample ratio mismatch\n\n### Phase 2: Results Interpretation\n1. Assess statistical significance (p < 0.05 threshold)\n2. Assess practical significance: was the lift meaningful for the business, not just real?\n3. Interpret confidence intervals\n4. Investigate confounding factors\n5. Recommend: Ship / Iterate / Kill / Run follow-up test\n6. **Validate** — Confirm the test ran for the full planned duration. Flag if it was stopped early (peeking problem). Confirm sample ratio mismatch did not occur.\n\n## Output Structure\n\n**[Design or Results header based on phase]**\n\n*Hypothesis:* \"If we [change], we expect [metric] to [move by X%] because [reason]\"\n\n*Primary metric:* [One metric only]\n*Guardrail metrics:* [2-3 max]\n*Required sample size:* [n per variant]\n*Estimated run time:* [days]\n*Pre-defined success threshold:* [specific number]\n*Design risk flags:* [any concerns]\n\n**Results (Phase 2 only):**\n*Statistical significance:* [p-value and conclusion]\n*Practical significance:* [lift size vs. business threshold]\n*Recommendation:* Ship / Iterate / Kill / Follow-up — [rationale]\n\n## Quality Checks\n\n- [ ] Hypothesis specifies the change, the metric, the direction, and the reason\n- [ ] Primary metric is singular — guardrail metrics are secondary\n- [ ] Success criteria are defined before the test launches (not after seeing results)\n- [ ] Test was not stopped early (or flagged clearly if it was)\n- [ ] Practical significance assessed separately from statistical significance\n- [ ] Sample ratio mismatch is checked in results interpretation\n\n## Anti-Patterns\n\n- [ ] Do not define success criteria after seeing preliminary results — post-hoc success definitions are HARKing (Hypothesising After Results are Known) and invalidate the experiment\n- [ ] Do not stop a test early because the result looks significant — early stopping dramatically inflates false positive rates; the test must run to the planned sample size\n- [ ] Do not treat statistical significance as the same as practical significance — a p < 0.05 result with a 0.1% lift is real but may not be worth shipping\n- [ ] Do not run the same experiment on the same population multiple times without correction — multiple testing inflates the chance of a false positive proportionally\n- [ ] Do not use more than one primary metric — multiple primary metrics require multiple hypothesis corrections and make the ship/kill decision ambiguous\n"}}};

let storageOK = true;
const KEY_S1 = 'venturelab.workbook5.v1';   /* yesterday's workbook, same browser: venture, skill, app and cover carry over */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return adopt(JSON.parse(raw));
    const old = localStorage.getItem(KEY_S1);
    if (old) {
      const d = JSON.parse(old), f = fresh();
      Object.assign(f.venture, (d && d.venture) || {});
      Object.assign(f, { vskill: d.vskill || '', app: d.app || f.app, cover: d.cover || f.cover, founder: d.founder || '', fromS1: true });
      return adopt(f);
    }
  } catch (e) { storageOK = false; }
  return fresh();
}
function adopt(d) {
  const f = fresh();
  const s = Object.assign(f, d || {});
  s.venture = Object.assign(fresh().venture, (d && d.venture) || {});
  if (!MANUAL[s.app]) s.app = 'chatgpt';
  if (!COVERS.some(c => c.id === s.cover)) s.cover = 'navy';
  if (!Array.isArray(s.custom)) s.custom = [];
  if (!s.shelf || typeof s.shelf !== 'object') s.shelf = {};
  s.brief = Object.assign(fresh().brief, (d && d.brief) || {});
  s.s1 = Object.assign(fresh().s1, (d && d.s1) || {});
  if (!s.s1.done || typeof s.s1.done !== 'object') s.s1.done = {};
  s.s2 = Object.assign(fresh().s2, (d && d.s2) || {});
  if (!s.s2.done || typeof s.s2.done !== 'object') s.s2.done = {};
  s.s3 = Object.assign(fresh().s3, (d && d.s3) || {});
  if (!s.s3.done || typeof s.s3.done !== 'object') s.s3.done = {};
  if (!s.s3.runs || typeof s.s3.runs !== 'object') s.s3.runs = {};
  s.s4 = Object.assign(fresh().s4, (d && d.s4) || {});
  if (!s.s4.done || typeof s.s4.done !== 'object') s.s4.done = {};
  if (!s.s4.trust || typeof s.s4.trust !== 'object') s.s4.trust = {};
  if (!Array.isArray(s.log)) s.log = [];
  return s;
}

  const out = [], stack = []; let fm = 0, cur = 'purpose';
  md.replace(/\n$/, '').split('\n').forEach(line => {
    if (line === '---' && fm < 2 && (fm === 1 || !out.length)) { fm++; out.push([line, 'when']); return; }
    if (fm === 1) { out.push([line, 'when']); return; }
    const h = line.match(/^(#{1,4}) +(.+?)\s*$/);
    if (h) {
      const lvl = h[1].length; let t = lvl === 1 ? 'purpose' : partOf(h[2]);
      while (stack.length && stack[stack.length - 1][0] >= lvl) stack.pop();
      if (!t) t = stack.length ? stack[stack.length - 1][1] : 'purpose';

}
function sheetLines(md, o) {
  const name = one(S.venture.name);
  let inFm = false, fmSeen = 0, fm = 0, sec = '';
  const render = line => {
    let h = esc(line);
    if (line === '---' && fmSeen < 2) { fmSeen++; inFm = fmSeen === 1; return '<span class="fm">---</span>'; }
    if (inFm) {
      const key = line.split(':')[0];
      const tag = o.keys && o.keys[key] ? '<span class="k">' + o.keys[key] + '</span>' : '';
      return tag + '<span class="fm">' + h + '</span>';
    }
    if (/^#/.test(line)) {
      const tag = o.keys && o.keys.body && /^# /.test(line) ? '<span class="k">' + o.keys.body + '</span>' : '';
      return tag + '<span class="h">' + h + '</span>';
    }
    if (name) h = h.split(esc(name)).join('<mark>' + esc(name) + '</mark>');

  const lines = md.replace(/\n$/, '').split('\n');

  if (o.parts) return anatomy(md).map(([line, part]) => `<span class="ln" data-sec="${part}">${render(line) || '\u200b'}</span>`).join('');
  if (!o.secs) return lines.map(render);
  /* One block per line, tagged with the question that writes it */
  return lines.map(line => {
    let tag;

    else if (fm === 1) tag = /^name:/.test(line) ? 'name' : /^description:/.test(line) ? 'job when' : '';

}

    const f = document.getElementById(one(d.job) ? 'd-title' : 'd-job'); if (f) f.focus();
    return;
  }
  const rec = { title: d.title, job: d.job, when: d.when, needs: d.needs, steps: d.steps, output: d.output, checks: d.checks || '', extra: d.extra, rules: d.rules.slice() };
  if (d.base) rec.base = d.base;
  if (d.editing) {
    rec.id = d.editing;
    const i = S.custom.findIndex(c => c.id === d.editing);
    if (i >= 0) S.custom[i] = rec; else S.custom.push(rec);
  } else {
    rec.id = uniqueId(slug(d.title), null);
    S.custom.push(rec);
  }
  S.draft = null; save();
  location.hash = '#/skill/' + rec.id;
}

  ['4. Numbers', 'Finance & Fundraising', 'One line each: the number · its value · the date · where it comes from. Totals so far.'],
  ['5. Weekly notes', 'everyone', 'Newest week first.']

/* An entry is still empty while every line is only a heading such as "What happened:" */
const blankLog = t => String(t || '').split('\n').every(l => !l.trim() || /^[^:]{1,40}:\s*$/.test(l.trim()));
const fileBase = () => slug(S.venture.name) || 'venture';
/* A Google Docs link, without the extras Google adds after the document ID */
const docLink = s => { const m = one(s).match(/^https:\/\/docs\.google\.com\/document\/(?:u\/\d+\/)?d\/([\w-]{20,})/); return m ? `https://docs.google.com/document/d/${m[1]}/edit` : ''; };
const logLink = () => docLink(S.s2.logUrl);
const logRef = () => `our venture log (${logLink() || `the Google Doc "${vname()} venture log"`})`;
const linkNote = s => !one(s) ? '' : docLink(s) ? ICON.check + ' A Google Docs link.' : 'This is not a Google Docs link yet. Open the Doc and copy the address at the top of your browser.';
const logRows = () => S.log.filter(e => !blankLog(e.text)).sort((a, b) => b.week.localeCompare(a.week));
const logWeeks = () => (logRows().length ? logRows() : [{ week: weekOf(new Date()), text: LOG_TEMPLATE }]);
/* The venture log as plain text, ready to paste into a new Google Doc */
function logDoc() {
  const L = [`${vname()} venture log`, '', 'The team keeps this up to date, and every agent reads it. Newest entries first. Numbers are totals so far.', ''];
  SECTIONS.forEach(([t, who, how], i) => {
    L.push(`${t} (${who})`, how);
    if (i === 0 && one(S.s2.register)) L.push(String(S.s2.register).trim());
    if (i === 4) logWeeks().forEach(e => L.push('', 'Week of ' + longDate(e.week), String(e.text).trim()));
    L.push('');
  });
  return L.join('\n').trim();
}
/* The same log as a file, for teams without a Google account */
function logMd() {
  const L = [`# ${vname()}: venture log`, '', 'The team keeps this up to date, and every agent reads it. Newest entries first. Numbers are totals so far.', ''];

  });

}
function setLog(week, text) { const e = S.log.find(x => x.week === week); if (e) e.text = text; else S.log.push({ week, text }); }

root.addEventListener('click', async e => {

  if (d.go) { location.hash = d.go; return; }
  if (d.route) { S.route = d.route; save(); renderView(true); return; }

    /* On this page: scroll to it. On another page: let the link open that page, then scroll. */

    if (document.getElementById(d.scroll)) { e.preventDefault(); go(); } else setTimeout(go, 80);
    return;
  }
  if (d.part) { showPart(d.part); return; }

    e.preventDefault();
    const st = baseOf(d.startid), cur = S.draft;
    if (st && !(cur && cur.base === st.id && !cur.editing)) {
      if (cur && one(cur.job) && !confirm('Replace the skill you are writing with the ' + st.title + ' example?')) return;

    case 'onb-skip': onbNext(); break;
    case 'onb-example': Object.assign(S.venture, EXAMPLE); S.vskill = 'rehearse'; S.back = ''; openWorkbook(); break;

    case 'copy-onboard': { const ok = await copyText(onboardPrompt()); toast(ok ? 'Prompt copied. Paste it into ' + app().name + '.' : 'Could not copy. Open "Read the prompt first" and copy from there.'); break; }

    case 'export': download(new Blob([JSON.stringify({ kind: 'venturelab-skill-workbook', v: 1, saved: new Date().toISOString(), state: S }, null, 2)], { type: 'application/json' }), (slug(S.venture.name) || 'venture') + '-skill-workbook.json'); toast('Copy saved to your downloads'); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset': if (confirm('Start again? This removes your venture and your skills from this browser. Save a copy first if you want to keep them.')) { try { localStorage.removeItem(KEY); } catch (_) { /* storage blocked */ } S = fresh(); returning = false; if (location.hash) history.replaceState(null, '', location.pathname + location.search); renderOnb(); } break;
  }
});

/* Write a skill: show where the current question lands in the file */
const askSec = e => { const a = e.target.closest && e.target.closest('.ask[data-sec]'); if (a && a.dataset.sec !== activeSec) showSec(a.dataset.sec); };
root.addEventListener('focusin', askSec);
root.addEventListener('pointerdown', askSec);
root.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.matches('textarea.big, #maker textarea, .s2 textarea, .s3 textarea, .s4 textarea')) grow(t);
  if (d.v) {
    S.venture[d.v] = t.value; save();
    if (!S.onboarded) syncOnbLabel();
    else {
      document.getElementById('plateName').textContent = vname();
      document.getElementById('plateIdea').textContent = one(S.venture.idea);
      document.title = vname() + ', session 2 workbook';
    }
  } else if (d.vs) { S.vskill = slug(t.value); S.manual = !S.vskill; save(); }
  else if (d.s) { S[d.s] = t.value; save(); }
  else if (d.d) { draft()[d.d] = t.value; save(); renderPreview(); }
  else if (d.back) {
    /* The four lines pasted back from the AI app: during first run they fill the cover, later they refresh the labels */
    takeBack(t.value);
    if (!S.onboarded) syncOnbLabel();
    else { document.getElementById('plateName').textContent = vname(); document.getElementById('plateIdea').textContent = one(S.venture.idea); document.title = vname() + ', session 2 workbook'; }
  }
  else if (d.log) { setLog(d.log, t.value); save(); refreshS2(); }
  else if (d.s2) {
    S.s2[d.s2] = t.value; save();
    const note = document.getElementById(d.s2 + 'Ok');
    if (note) note.innerHTML = linkNote(t.value);
    refreshS2(); refreshS3();
  }
  else if (d.s3) { S.s3[d.s3] = t.value; save(); refreshS3(); }
  else if (d.run) { (S.s3.runs[d.run] = S.s3.runs[d.run] || {})[d.k] = t.value; save(); }
  else if (d.s4) { S.s4[d.s4] = t.value; save(); refreshS4(); }
});
root.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.flag) { setFlag(t.dataset.id, t.dataset.flag, t.checked); renderView(true); return; }
  if (t.dataset.back && S.onboarded) { renderView(true); return; }
  if (t.dataset.s1done) { S.s1.done[t.dataset.s1done] = t.checked; save(); renderView(true); return; }
  if (t.dataset.conn) { (CONN_STATE()[t.dataset.conn] = CONN_STATE()[t.dataset.conn] || {})[t.dataset.k] = t.checked; save(); renderView(true); return; }
  if (t.dataset.s2done) { S.s2.done[t.dataset.s2done] = t.checked; save(); renderView(true); return; }
  if (t.dataset.s2pick) { S.s2.skill = t.value; save(); renderView(true); return; }
  if (t.dataset.s3done) { S.s3.done[t.dataset.s3done] = t.checked; save(); renderView(true); return; }
  if (t.dataset.s3pick) { S.s3.skill = t.value; save(); renderView(true); return; }
  if (t.dataset.trust) { S.s4.trust[t.dataset.trust] = t.value; save(); renderView(true); return; }
  if (t.dataset.s4done) { S.s4.done[t.dataset.s4done] = t.checked; save(); renderView(true); return; }
  if (t.dataset.s4 === 'pattern') { renderView(true); return; }
  if (t.id === 'importFile' && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.kind !== 'venturelab-skill-workbook' || !data.state) throw new Error('wrong file');
        S = adopt(data.state); S.onboarded = true; save(); renderApp(); toast('Workbook opened');
      } catch (err) { toast('That file is not a copy of this workbook'); }
    };
    reader.readAsText(t.files[0]);
  }
});
root.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'onbForm') onbNext();
  if (e.target.id === 'maker') saveDraft();
});
root.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.matches('#onbForm textarea')) { e.preventDefault(); onbNext(); }
});
window.addEventListener('hashchange', () => { if (S.onboarded) renderView(); });

if (S.onboarded) renderApp(); else renderOnb();

</script>
</body>
</html>
