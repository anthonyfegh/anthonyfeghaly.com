<style>
:root{--forest:#2D3829;--night:#1a1f16;--cream:#f5f4f0;--gold:#c7a56c;--ice:#87C2CB}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:'Manrope',system-ui,sans-serif;display:grid;place-items:center;padding:16px;overflow:hidden}
.blob{position:fixed;border-radius:50%;pointer-events:none}
.b1{width:340px;height:340px;background:var(--gold);right:-140px;top:-120px;opacity:.9;animation:drift 10s ease-in-out infinite alternate}
.b2{width:220px;height:220px;background:var(--ice);left:-90px;bottom:-60px;opacity:.85;animation:drift 12s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(24px,30px) scale(1.08)}}
.box{position:relative;width:100%;max-width:340px;background:var(--forest);border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.box img{height:26px;display:block;margin-bottom:22px}
.k{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
h1{font-size:26px;font-weight:800;margin:8px 0 18px;line-height:1.15}
input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(245,244,240,.3);background:rgba(245,244,240,.06);color:var(--cream);font:600 16px 'Manrope';outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:99px;background:var(--gold);color:var(--night);font:800 15px 'Manrope';cursor:pointer}
button[disabled]{opacity:.6}
.err{min-height:20px;margin-top:10px;font-size:13px;font-weight:700;color:#f0a58f}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
</style>
</head>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const raw=b(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'), p=document.getElementById('p'), e=document.getElementById('e'), go=document.getElementById('go');
f.addEventListener('submit',async ev=>{
  ev.preventDefault();go.disabled=true;go.textContent='Abriendo…';e.textContent='';
  try{const html=await open(p.value);try{sessionStorage.setItem('rw',p.value)}catch(_){};show(html)}
  catch(_){e.textContent='Contraseña incorrecta';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');go.disabled=false;go.textContent='Entrar';p.select()}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('rw')}catch(_){};if(s){try{show(await open(s))}catch(_){}}})();
</script>
