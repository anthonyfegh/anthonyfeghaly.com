:root{--forest:#2D3829;--night:#1a1f16;--cream:#f5f4f0;--gold:#c7a56c;--ice:#87C2CB;--sun:#E8B04B;--aqua:#6ECBD6;--leaf:#2F6B47;--deep:#141a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--night);color:var(--cream);font-family:'Manrope',system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.b1{width:340px;height:340px;background:var(--gold);right:-140px;top:-120px;opacity:.9;animation:drift 10s ease-in-out infinite alternate}
.b2{width:220px;height:220px;background:var(--ice);left:-90px;bottom:-60px;opacity:.85;animation:drift 12s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(24px,30px) scale(1.08)}}
.box{position:relative;z-index:1;width:100%;max-width:340px;background:var(--forest);border-radius:24px;padding:28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.box img{height:26px;display:block;margin-bottom:22px}
.k{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
h1{font-size:26px;font-weight:800;margin:8px 0 18px;line-height:1.15}
input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(245,244,240,.3);background:rgba(245,244,240,.06);color:var(--cream);font:600 16px 'Manrope';outline:none}
input:focus{border-color:var(--gold)}
#go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:99px;background:var(--gold);color:var(--night);font:800 15px 'Manrope';cursor:pointer}
#go[disabled]{opacity:.6}
.err{min-height:20px;margin-top:10px;font-size:13px;font-weight:700;color:#f0a58f}
.shake{animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}

/* chooser */
.pick{position:relative;z-index:1;width:100%;max-width:720px;display:none}
.pick.on{display:block;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.pick > img{height:24px;display:block;margin:0 auto 14px}
.pick h1{text-align:center;font-size:28px;margin:0 0 22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit;min-height:300px;padding:24px;display:flex;flex-direction:column;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 26px 50px rgba(0,0,0,.45);outline:none}
.tile > *{position:relative}
.tile .tk{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.tile .nm{font-family:'Atelier','Manrope',sans-serif;font-size:58px;line-height:.85;margin-top:auto}
.tile .ln{font-size:14px;font-weight:700;margin-top:10px;opacity:.9}
.tile .go2{margin-top:16px;align-self:flex-start;font-size:13px;font-weight:800;padding:9px 16px}
/* member tile: soft, round, the member Wrapped's look */
.tile.mem{border-radius:24px;background:var(--gold);color:var(--night)}
.tile.mem .c1{position:absolute;width:220px;height:220px;border-radius:50%;background:var(--ice);right:-70px;top:-70px}
.tile.mem .c2{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--night);right:118px;top:28px;opacity:.9}
.tile.mem .go2{background:var(--night);color:var(--gold);border-radius:99px}
/* coach tile: square, graph paper, the coach Wrapped's look */
.tile.coa{border-radius:8px;background-color:var(--leaf);color:var(--cream);
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px}
.tile.coa .tape{position:absolute;top:22px;right:18px;background:var(--aqua);color:var(--deep);font-size:10px;font-weight:800;letter-spacing:.18em;padding:5px 10px;transform:rotate(3deg)}
.tile.coa .md{position:absolute;right:26px;top:72px;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font:400 40px 'Atelier';color:var(--deep);
  background:radial-gradient(circle at 38% 32%,#FCE3A6,#E8B04B 45%,#B9822A);box-shadow:0 10px 20px rgba(0,0,0,.3)}
.tile.coa .md::before{content:'';position:absolute;inset:12px;border-radius:50%;border:2px solid rgba(20,26,18,.3)}
.tile.coa .go2{background:var(--sun);color:var(--deep);border-radius:4px}
</style>
</head>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const raw=b(PAYLOAD), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct)));
}
// a "back to the choice" pill, on wide screens only (on a phone the story fills the screen; reload goes back)
const BACK='<style>.rw-back{position:fixed;left:16px;top:16px;z-index:999;padding:8px 14px;border-radius:99px;background:rgba(245,244,240,.12);color:#f5f4f0;font:700 12px Manrope,system-ui,sans-serif;text-decoration:none}.rw-back:hover{background:rgba(245,244,240,.22)}@media (max-width:599px){.rw-back{display:none}}</style><a class="rw-back" href="" onclick="location.reload();return false">← Elegir otro Wrapped</a>';
function show(html){document.open();document.write(html.replace('</body>',BACK+'</body>'));document.close()}
let pages=null;
function choose(){document.querySelectorAll('[data-f]').forEach(el=>{const [k,f]=el.dataset.f.split('.');el.textContent=pages.meta[k][f]});document.getElementById('f').style.display='none';document.getElementById('pick').classList.add('on');document.querySelector('.tile').focus()}
document.querySelectorAll('.tile').forEach(t=>t.addEventListener('click',()=>show(pages[t.dataset.k])));
const f=document.getElementById('f'), p=document.getElementById('p'), e=document.getElementById('e'), go=document.getElementById('go');
f.addEventListener('submit',async ev=>{
  ev.preventDefault();go.disabled=true;go.textContent='Abriendo…';e.textContent='';
  try{pages=await open(p.value);try{sessionStorage.setItem('rw',p.value)}catch(_){};choose()}
  catch(_){e.textContent='Contraseña incorrecta';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');go.disabled=false;go.textContent='Entrar';p.select()}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('rw')}catch(_){};if(s){try{pages=await open(s);choose()}catch(_){}}})();
</script>
