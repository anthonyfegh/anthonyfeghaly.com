      <ol class="mini">
        <li>Select it or name it: type ${m.call} and pick ${esc(nm)}, or start with "Use the ${esc(nm)} skill". The first messages in this workbook already name it, for example "Use the market-sizing skill and the ${esc(nm)} skill."</li>
        <li>${a} may also open it by itself when you mention ${v}, and a line in custom instructions can help. Neither is guaranteed, so check that the answer used it.${chat ? '' : ' The grey line above Claude\'s answer shows which skills it read.'}</li>
        <li>If ${a} cannot open the skill, for example in another account or when skills are switched off, paste your latest venture details into the chat instead.</li>
        <li>${a}'s memory and the saved skill are separate. Memory can hold older or different facts about ${v}. Treat the skill as your record, and correct the memory when they disagree.</li>
      </ol>
      <p class="say">A line for ${a}'s custom instructions, in its settings. It can help, but it is not a guarantee:</p>
      ${copyBox('vhook', `When I talk about ${vname()}, open the ${nm} skill first. If I tell you something new about ${vname()}, offer to update the skill.`)}
    </section>
    <section class="sec what again" id="current"><h2>Keep it current</h2>
      <p class="def">Your venture changes every week, so this skill should too. Update it whenever you learn something, get a result or make a decision. When it is out of date, every other skill works from old facts.</p>
      <h3>When to update it</h3>
      <div class="ways">
        <div><b>You learn something</b><p>An interview, a customer quote, a fact about the market. It goes under What we know, with its date and source.</p></div>
        <div><b>You get a result</b><p>A skill's HTML page, your Discovery brief, an experiment, a new number. It goes under What we know or Numbers.</p></div>
        <div><b>An assumption is tested</b><p>Move it from What we assume to What we know, as supported or wrong, with the evidence.</p></div>
        <div><b>You decide something</b><p>Your priority segment, a price, a new focus. Update Current focus and the Snapshot.</p></div>
        <div><b>Something big changes</b><p>A new co-founder, a new stage, a pivot. Update the Snapshot, then run the skills that depend on it again.</p></div>
        <div><b>A week goes by</b><p>Catch up: ask ${a} what looks out of date.</p></div>
      </div>
      <h3>How to update it</h3>
      <ol class="do">
        <li><span class="n">1</span><div><h2>Notice the offer</h2><p>When you mention a change in a chat about ${v}, ${a} may say "This changes what I have on file" and show the old line and the new line. That is only a proposal: the saved skill changes when you complete the save step${chat ? ', with Skill Creator' : ''}. A correction you only type in a chat does not update the skill.</p></div></li>
        <li><span class="n">2</span><div><h2>Tell it directly</h2>${chat ? `<p>${ui('Open Skill Creator: [[Customize]], [[Add a skill]], [[Skill Creator]], or @skill-creator in a [[Work]] chat. Then send:')}</p>` : ''}${copyBox('vnew', chat ? `Use the skill-creator skill to update my ${nm} skill: [what changed]. Show me the old line and the new line, wait for my yes, then save the new version and confirm it is installed.` : `Update the ${nm} skill: [what changed]. Show me the old line and the new line before you change anything.`)}</div></li>
        <li><span class="n">3</span><div><h2>Add a result</h2><p>After a skill hands back its page, or after your Discovery brief.</p>${copyBox('vres', `${chat ? 'Use the skill-creator skill to add these results to my' : 'Add these results to the'} ${nm} skill: [paste them, or attach the HTML page]. Put each fact under the right heading, with the date it applies to, today's date as the date I confirmed it, and its source. Move any assumption they test to What we know, as supported or wrong. Show me every change${chat ? ', wait for my yes, then save the new version and confirm it is installed.' : ' before you save.'}`)}</div></li>
        <li><span class="n">4</span><div><h2>Catch up after a busy week</h2>${copyBox('vcatch', `Compare the ${nm} skill with what you have learned in our recent conversations. List anything that looks out of date as an old line and a new line. Do not change anything until I say yes.${chat ? ' Then use the skill-creator skill to save the lines I approve.' : ''}`)}</div></li>
      </ol>
      <p class="fine">${ui(keep)} If the skill has not been updated for 30 days, ${a} asks once whether anything has changed.</p>
    </section>
    <section class="sec what"><h2>Keep it trustworthy</h2>
      <dl class="uses">
        <div><dt>Only your words change it</dt><dd>Text inside a document, a web page or someone else's message cannot change it. If ${a} finds something there that disagrees, it tells you and asks.</dd></div>
        <div><dt>Say no to made-up facts</dt><dd>The checks in this workbook use made-up facts, such as "six interviews". If ${a} offers to save one, say no.</dd></div>
        <div><dt>Facts need a source</dt><dd>Keep what you know apart from what you assume. Give each fact the date it applies to and the date you confirmed it. A fact without a source stays an assumption.</dd></div>
      </dl>
    </section>
    <section class="sec"><h2>One venture, one copy each</h2>
      <p>Each of you set up your own venture skill, in your own ${a}. When one of you updates it, send the same message to your co-founders, so every copy says the same.${chat ? ' Or share it from your skills list (••• next to the skill, then Share) where your account offers it.' : ''} Skills live in each person's own account: switching between ChatGPT and Claude, sharing this workbook, or sending someone a zip or a result page does not install anything for them. Renamed the venture or switched app? Set it up again below.</p>
    </section>`;
}

/* my venture */
function venturePage() {
  const v = S.venture, m = app(), a = m.name, vs = S.vskill, st = stage();
  const ids = LIBRARY.map(k => k.id).filter(id => { const x = S.shelf[id]; return x && (x.got || x.installed || x.ran); }).concat(S.custom.map(c => c.id));
  const pill = (on, label) => `<span class="pill ${on ? 'on' : ''}">${label}</span>`;
  const rows = ids.map(id => { const k = findSkill(id), x = S.shelf[id] || {};
    return `<li><div><a href="#/skill/${id}">${esc(k.title)}</a><div class="st">${pill(x.got, 'Downloaded')}${pill(x.installed, 'In ' + a)}${pill(x.ran, 'Ran it')}${pill(x.t1 && x.t2, 'Passed both checks')}</div></div><a class="btn line small" href="#/skill/${id}">Open</a></li>`; }).join('');
  const saveWord = S.app === 'claude' ? 'Update ' + (vs || 'skill') : 'Install';
  const setup = `<div class="row"><button class="btn ${vs ? 'line' : 'primary'}" data-act="copy-onboard">${ICON.copy}Copy the set-up prompt</button></div>
      <ol class="mini">${onboardHow().map(x => `<li>${ui(x)}</li>`).join('')}<li>Paste the four lines it ends with into the box below.</li></ol>
      <textarea class="area" id="f-back" data-back="1" rows="4" placeholder="Venture: ...&#10;One line: ...&#10;Stage: ...&#10;Skill: ..." aria-label="The four lines from ${a}">${esc(S.back)}</textarea>`;
  return `<header class="head"><h1>My venture</h1>
      <p class="lede">${vs
        ? `What ${a} knows about ${esc(vname())} is saved in a skill called <b>${esc(vs)}</b>. Select it or name it when you work on ${esc(vname())}. When you tell ${a} something new, it may offer an update: the skill changes only when you save the new version.`
        : `${esc(vname())} is not set up in ${a} yet. Until it is, the workbook adds one line about your venture to each message.`}</p></header>
    ${vs ? `<dl class="facts5 onfile">
      <div><dt>Venture</dt><dd>${esc(vname())}</dd></div>
      <div><dt>Its skill in ${a}</dt><dd>${esc(vs)}</dd></div>
      <div><dt>One line</dt><dd>${esc(one(v.idea)) || 'Not given'}</dd></div>
      <div><dt>Stage</dt><dd>${st ? st.t : 'Not given'}</dd></div>
    </dl>
    ${vskillGuide()}
    <details class="opt"><summary>Set it up again, or bring the four lines back</summary>
      <p>Use this if you renamed the venture, switched app, or the workbook lost its labels.</p>${setup}</details>`
      : `<section class="sec"><h2>Set it up in ${a}</h2>
      <p>${a} writes down what it already knows about your venture, asks you for the rest, and saves it as a skill named after the venture.</p>${setup}</section>
    <div class="form">
      <div><label for="v-name">Venture name</label><input class="input" id="v-name" data-v="name" value="${esc(v.name)}" maxlength="60" autocomplete="off"></div>
      <div><label for="v-idea">What it does, in one line</label><textarea class="area" id="v-idea" data-v="idea" rows="2" maxlength="280">${esc(v.idea)}</textarea></div>
    </div>
    ${vskillGuide()}`}
    <section class="sec"><h2>This workbook</h2>
      <p>The stage decides which skills the workbook suggests first. The cover is yours.</p>
      <div class="form" style="margin-top:14px">
        <div><label>Stage</label>${stageTiles().replace('class="tiles"', 'class="tiles" style="margin-top:0"')}</div>
        <div><label>Cover</label>${swatches().replace('class="swatches"', 'class="swatches" style="margin-top:6px"')}</div>
      </div>
    </section>
    <section class="sec"><h2>My skills</h2><p>The skills you have taken from the library or written yourself, and how far you got with each.</p>
      ${rows ? `<ul class="mine">${rows}</ul>` : `<div class="empty"><p>Nothing here yet. Take your first skill from the library.</p><p style="margin-top:14px"><a class="btn primary small" href="#/library">Open the library</a></p></div>`}
    </section>
    <section class="sec"><h2>Keep a copy</h2>
      <p>This workbook saves to this browser on this device${storageOK ? '' : ', but your browser is blocking that right now'}. To continue on another computer, or to share your work with a co-founder, save a copy and open it there. Save a copy downloads your answers and progress in this workbook as a .json file, and Open a copy loads that file. It does not contain the skills in ChatGPT or Claude: those stay in each person's account.</p>
      <div class="maker-actions"><button class="btn line" data-act="export">${ICON.down}Save a copy</button>
        <button class="btn line" data-act="import">Open a copy</button><input type="file" id="importFile" accept=".json,application/json" hidden>
        <button class="btn quiet" data-act="reset">Start again</button></div>
    </section>`;
}

/* ---------- chapters ---------- */
/* Each chapter teaches one capability and builds one of the syllabus's agents with it. Start reopens the one you were in. */
const CHAPTERS = [
  { n: 1, slug: 'skills', t: 'Skills', d: 'Market & Customer Discovery' }
];
const ymd = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const longDate = s => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
function weekOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return ymd(x); }
function sessionStrip(n) {
  return `<nav class="sessions" aria-label="Chapters">${CHAPTERS.map(c => `<a href="#/${c.slug}" ${c.n === n ? 'aria-current="page"' : ''}><b>${c.t}</b><span>${c.d}</span></a>`).join('')}</nav>`;
}
/* [done, html, link]: done true shows a tick, false a "Do it now" link, null a plain reminder */
const haveList = items => `<ul class="have">${items.map(([ok, html, href]) => `<li class="${ok === true ? 'ok' : ok === null ? 'note' : ''}"><span>${ok === true ? ICON.check : ''}</span><div>${html}${ok === false && href ? ` <a href="${href}"${href === '#/write' ? ' data-startid="weekly-priorities"' : ''}>Do it now</a>` : ''}</div></li>`).join('')}</ul>`;
function sessionPage(n) {
  if (S.part !== n) { S.part = n; save(); }
  return startPage();
}
/* A button to change a skill written here. The Weekly Priorities example, not yet saved, opens in Create your own skill. */
const saved = k => S.custom.some(c => c.id === k.id);
const changeBtn = (k, label) => !k.custom ? '' : saved(k)
  ? `<button class="btn quiet small" data-act="edit" data-id="${k.id}">${label}</button>`
  : `<a class="btn quiet small" href="#/write" data-startid="weekly-priorities">Write this skill</a>`;
/* Until the team saves its own Weekly Priorities, the Copilot shows the worked example */
const draftWeekly = () => customSkill(Object.assign({}, starterDraft(STARTERS[0]), { id: 'weekly-priorities' }), 0);
const skillOptions = (list, k) => (list.some(x => x.id === k.id) ? list : [k].concat(list)).map(x => `<option value="${x.id}" ${x.id === k.id ? 'selected' : ''}>${esc(x.title)}${x.custom && !saved(x) ? ' (not saved yet)' : ''}</option>`).join('');
/* Keep copy boxes in step with the answers, without redrawing the page while someone types */
function syncCopy(ask) {
  Object.keys(ask).forEach(key => {
    if (!(key in COPY)) return;
    COPY[key] = ask[key];
    const b = document.querySelector(`[data-act="copy"][data-key="${key}"]`);
    if (b) b.closest('.copy').querySelector('pre').textContent = ask[key];
  });
}
const stepHTML = (n, done, title, why, body) => `<li class="${done ? 'done' : ''}"><span class="n">${done ? ICON.check : n}</span><div>
          <h2>${title}</h2><p class="why"><b>Why it matters.</b> ${why}</p>${body}</div></li>`;

/* ---------- events ---------- */
function setFlag(id, flag, val) { (S.shelf[id] = S.shelf[id] || {})[flag] = val; save(); }

root.addEventListener('click', async e => {
  const t = e.target.closest('button, a');
  if (!t || !root.contains(t)) return;
  const d = t.dataset;

  if (d.cover) { S.cover = d.cover; save(); applyCover(); root.querySelectorAll('[data-cover]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cover === S.cover)); return; }
  if (d.stage) { S.venture.stage = S.venture.stage === d.stage && S.onboarded ? '' : d.stage; save(); root.querySelectorAll('[data-stage]').forEach(b => b.setAttribute('aria-pressed', b.dataset.stage === S.venture.stage)); return; }
  if (d.app) { S.app = d.app; save(); if (S.onboarded) renderView(true); else root.querySelectorAll('[data-app]').forEach(b => b.setAttribute('aria-pressed', b.dataset.app === S.app)); return; }
  if (d.go) { location.hash = d.go; return; }
  if (d.route) { S.route = d.route; save(); renderView(true); return; }
  if (d.scroll) {
    /* On this page: scroll to it. On another page: let the link open that page, then scroll. */
    const go = () => { const el = document.getElementById(d.scroll); if (el) el.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); };
    if (document.getElementById(d.scroll)) { e.preventDefault(); go(); } else setTimeout(go, 80);
    return;
  }
  if (d.part) { showPart(d.part); return; }
  if (d.startid) {
    /* Open Create your own skill with a worked example loaded, unless that example is already being written */
    e.preventDefault();
    const st = baseOf(d.startid), cur = S.draft;
    if (st && !(cur && cur.base === st.id && !cur.editing)) {
      if (cur && one(cur.job) && !confirm('Replace the skill you are writing with the ' + st.title + ' example?')) return;
      S.draft = starterDraft(st); save();
    }
    if (location.hash === '#/write') renderView(); else location.hash = '#/write';
    return;
  }
  if (d.rule) { const r = draft().rules, i = r.indexOf(d.rule); if (i < 0) r.push(d.rule); else r.splice(i, 1); t.setAttribute('aria-pressed', i < 0); save(); renderPreview(); return; }
  if (d.starter) { S.draft = starterDraft(STARTERS[+d.starter]); save(); renderView(true); toast('Example loaded. Change anything you like.'); return; }

  switch (d.act) {
    case 'onb-back': S.step = Math.max(0, S.step - 1); save(); renderOnb(); break;
    case 'onb-skip': onbNext(); break;
    case 'onb-example': Object.assign(S.venture, EXAMPLE); S.vskill = ''; S.back = ''; openWorkbook(); break;
    case 'onb-manual': S.manual = true; save(); renderOnb(); { const f = document.getElementById('f-name'); if (f) f.focus(); } break;
    case 'copy-onboard': { const ok = await copyText(onboardPrompt()); toast(ok ? 'Prompt copied. Paste it into ' + app().name + '.' : 'Could not copy. Open "Read the prompt first" and copy from there.'); break; }
    case 'download': { const k = findSkill(d.id); download(new Blob(skillZip(k), { type: 'application/zip' }), k.id + '.zip'); setFlag(k.id, 'got', true); toast(k.id + '.zip downloaded'); setTimeout(() => renderView(true), 400); break; }
    case 'prompt': { const k = findSkill(d.id); const ok = await copyText(buildPrompt(k)); if (ok) { setFlag(k.id, 'got', true); toast('Build prompt copied. Paste it into ' + app().name + '.'); setTimeout(() => renderView(true), 400); } else toast('Could not copy. Open "Read the file" and copy from there.'); break; }
    case 'copy': { const ok = await copyText(COPY[d.key] || ''); toast(ok ? 'Copied' : 'Could not copy. Select the text and copy it by hand.'); break; }
    case 'edit': { const c = S.custom.find(x => x.id === d.id); if (c) { S.draft = Object.assign(blankDraft(), c, { rules: (c.rules || []).slice(), editing: c.id }); save(); location.hash = '#/write'; } break; }
    case 'delete': if (confirm('Delete this skill from the workbook? A copy you already added to ' + app().name + ' stays there.')) { S.custom = S.custom.filter(c => c.id !== d.id); delete S.shelf[d.id]; save(); location.hash = '#/library'; } break;
    case 'clear-draft': S.draft = null; save(); renderView(); break;
    case 'export': download(new Blob([JSON.stringify({ kind: 'venturelab-skill-workbook', v: 1, saved: new Date().toISOString(), state: S }, null, 2)], { type: 'application/json' }), (slug(S.venture.name) || 'venture') + '-skill-workbook.json'); toast('Copy saved to your downloads'); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'reset': if (confirm('Start again? This removes your venture and your skills from this browser. Save a copy first if you want to keep them.')) { try { localStorage.removeItem(KEY); } catch (_) { /* storage blocked */ } S = fresh(); returning = false; if (location.hash) history.replaceState(null, '', location.pathname + location.search); renderOnb(); } break;
  }
});

/* Create your own skill: show where the current question lands in the file */
const askSec = e => { const a = e.target.closest && e.target.closest('.ask[data-sec]'); if (a && a.dataset.sec !== activeSec) showSec(a.dataset.sec); };
root.addEventListener('focusin', askSec);
root.addEventListener('pointerdown', askSec);
root.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.matches('textarea.big, #maker textarea, .s2 textarea, .s3 textarea, .s4 textarea')) grow(t);
  if (d.v) {
    S.venture[d.v] = t.value; save();
    if (!S.onboarded) syncOnbLabel();
    else {
      document.getElementById('plateName').textContent = vname();
      document.getElementById('plateIdea').textContent = one(S.venture.idea);
      document.title = vname() + ', session 1 workbook';
    }
  } else if (d.s) { S[d.s] = t.value; save(); }
  else if (d.d) { draft()[d.d] = t.value; save(); renderPreview(); }
  else if (d.back) {
    /* The four lines pasted back from the AI app: during first run they fill the cover, later they refresh the labels */
    takeBack(t.value);
    if (!S.onboarded) syncOnbLabel();
    else { document.getElementById('plateName').textContent = vname(); document.getElementById('plateIdea').textContent = one(S.venture.idea); document.title = vname() + ', session 1 workbook'; }
  }
});
root.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.flag) { setFlag(t.dataset.id, t.dataset.flag, t.checked); renderView(true); return; }
  if (t.dataset.back && S.onboarded) { renderView(true); return; }
  if (t.dataset.s1done) { S.s1.done[t.dataset.s1done] = t.checked; save(); renderView(true); return; }
  if (t.id === 'importFile' && t.files[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.kind !== 'venturelab-skill-workbook' || !data.state) throw new Error('wrong file');
        S = adopt(data.state); S.onboarded = true; save(); renderApp(); toast('Workbook opened');
      } catch (err) { toast('That file is not a copy of this workbook'); }
    };
    reader.readAsText(t.files[0]);
  }
});
root.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'onbForm') onbNext();
  if (e.target.id === 'maker') saveDraft();
});
root.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.matches('#onbForm textarea')) { e.preventDefault(); onbNext(); }
});
window.addEventListener('hashchange', () => { if (S.onboarded) renderView(); });

if (S.onboarded) renderApp(); else renderOnb();

</script>
</body>
</html>
