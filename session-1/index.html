:root{
  --desk:#E7E9F0;
  --page:#FFFFFF;
  --ink:#161A2E;
  --ink-2:#4A5167;
  --ink-3:#7C8399;
  --rule:#DDE0EA;
  --dot:#E2E5EE;
  --cover:#1E2A63;
  --accent:var(--cover);
  --soft:#F2F3F9;
  --good:#0B7A4F;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'Overpass Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@supports (color:color-mix(in srgb,#000 50%,#fff)){
  :root{--soft:color-mix(in srgb,var(--cover) 6%,#fff)}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.55 var(--font);color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--cover) 45%,#fff);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cover colours */
.c-navy{--c:#1E2A63}.c-forest{--c:#0E5F4A}.c-berry{--c:#9B1F4B}
.c-violet{--c:#5236AB}.c-petrol{--c:#0B6477}.c-poppy{--c:#C8371F}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:600 15px/1 var(--font);padding:13px 20px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s ease,background .15s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cover);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--cover) 88%,#000)}
.btn.line{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--soft)}
.btn.quiet{background:transparent;color:var(--ink-2);padding:10px 12px;font-weight:500}
.btn.quiet:hover{color:var(--ink);background:var(--soft)}
.btn.small{padding:9px 14px;font-size:13.5px}
.btn svg{flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.area{width:100%;background:#fff;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;font:400 16px/1.5 var(--font);transition:border-color .15s}
.input:hover,.area:hover{border-color:#C4C9D8}
.input:focus,.area:focus{border-color:var(--cover);outline:3px solid color-mix(in srgb,var(--cover) 18%,transparent);outline-offset:0}
.area{resize:vertical;min-height:84px}
::placeholder{color:#A3A9BB}
kbd.ui{font:500 .92em/1.3 var(--font);background:#fff;border:1px solid #C9CEDC;border-bottom-width:2px;border-radius:6px;padding:1px 7px;white-space:nowrap}

/* ---------- first run: the notebook ---------- */
.onb{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}
.onb-left{display:grid;place-items:center;padding:40px 24px;perspective:1800px}
.onb-right{background:var(--page) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/24px 24px;display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,6vw,88px)}
.nb{width:min(340px,64vw);aspect-ratio:10/14;position:relative;border-radius:6px 16px 16px 6px;background:var(--cover);color:#fff;transform-origin:left center;transition:background-color .35s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 34px 60px -34px color-mix(in srgb,var(--cover) 60%,#000),0 2px 6px rgba(22,26,46,.2)}
.nb::before{content:"";position:absolute;inset:0 auto 0 0;width:26px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.07))}
.nb-band{position:absolute;top:-3px;bottom:-3px;right:38px;width:11px;border-radius:3px;background:color-mix(in srgb,var(--cover) 60%,#000);box-shadow:1px 0 0 rgba(255,255,255,.08)}
.nb-label{position:absolute;left:52px;right:70px;top:16%;background:#fff;color:var(--ink);border-radius:4px;padding:13px 15px 15px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.nb-label small{display:block;font-size:11.5px;color:var(--ink-3)}
.nb-label b{display:block;font-size:25px;line-height:1.08;font-weight:600;letter-spacing:-.01em;margin-top:5px;min-height:1.08em;overflow-wrap:anywhere}
.nb-label b.empty{color:#C2C7D6}
.nb-label span{display:block;font-size:12.5px;line-height:1.4;color:var(--ink-2);margin-top:9px;overflow-wrap:anywhere}
.nb-foot{position:absolute;left:52px;right:70px;bottom:26px;font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.72)}
.nb-foot b{display:block;color:#fff;font-weight:500}
.onb.opening .nb{transform:rotateY(-108deg);transition:transform .75s cubic-bezier(.6,.04,.3,1)}
.onb.opening{opacity:0;transition:opacity .4s ease .5s}

.q{max-width:560px;width:100%}
.q-count{font-size:14px;color:var(--ink-3)}
.q h1{font-size:clamp(30px,4vw,46px);line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:10px 0 12px;text-wrap:balance}
.q .hint{color:var(--ink-2);font-size:17px;max-width:46ch}
.q .big{display:block;width:100%;margin-top:26px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;padding:8px 0 10px;font:500 clamp(22px,2.7vw,29px)/1.25 var(--font)}
.q textarea.big{resize:none;min-height:2.6em;overflow:hidden;font-size:clamp(20px,2.3vw,25px);line-height:1.3}
.q .big:focus{outline:0;border-bottom-color:var(--cover);box-shadow:0 2px 0 var(--cover)}
.q .two{display:grid;gap:22px;margin-top:8px}
.q label.small{display:block;font-size:14px;color:var(--ink-2);margin-top:26px}
.q label.small + .big{margin-top:2px;font-size:22px}
.swatches{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);cursor:pointer;position:relative}
.swatch[aria-pressed=true]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:24px}
.tile{text-align:left;border:1.5px solid var(--rule);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:#BFC5D6}
.tile[aria-pressed=true]{border-color:var(--cover);box-shadow:0 0 0 3px color-mix(in srgb,var(--cover) 16%,transparent)}
.tile b{display:block;font-weight:600;font-size:17px}
.tile span{display:block;font-size:14px;line-height:1.4;color:var(--ink-2);margin-top:3px}
.q-nav{display:flex;align-items:center;gap:8px;margin-top:34px;flex-wrap:wrap}
.q-nav .grow{flex:1}
.q-dots{display:flex;gap:6px;margin-bottom:22px}
.q-dots i{width:22px;height:3px;border-radius:2px;background:var(--rule)}
.q-dots i.on{background:var(--cover)}
.q .fine{font-size:13.5px;color:var(--ink-3);margin-top:22px;max-width:52ch}
.q-actions{margin-top:22px}
.q .onb-how{margin-top:18px;padding-left:22px;display:grid;gap:7px;color:var(--ink-2);font-size:16px;max-width:52ch}
.q .onb-read{margin-top:18px}
.q .onb-read summary{cursor:pointer;font-weight:500;color:var(--ink-2);font-size:15px}
.q .onb-read .copy{margin-top:10px}
.q .onb-read .copy pre{padding-right:0;max-height:240px}
.q .onb-back{margin-top:22px;font:400 15px/1.6 var(--mono);min-height:7.6em}
.q .onb-got{margin-top:14px;font-size:15px}
.onfile{margin-top:26px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px 20px;max-width:640px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit}

/* ---------- the open workbook ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;animation:appin .45s ease both}
@keyframes appin{from{opacity:0}to{opacity:1}}
.side{background:var(--cover);color:#fff;position:sticky;top:0;height:100vh;height:100dvh;padding:20px 16px 18px;display:flex;flex-direction:column;overflow:auto;transition:background-color .35s ease}
.side::before{content:"";position:absolute;inset:0 auto 0 0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.side > *{position:relative}
.plate{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:0;border-radius:5px;padding:12px 14px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.28)}
.plate small{display:block;font-size:11.5px;color:var(--ink-3)}
.plate b{display:block;font-size:20px;line-height:1.12;font-weight:600;letter-spacing:-.01em;margin-top:3px;overflow-wrap:anywhere}
.plate span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:12.5px;line-height:1.4;color:var(--ink-2);margin-top:7px}
.nav{display:grid;gap:2px;margin-top:22px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.82);text-decoration:none;font-weight:500;font-size:15.5px}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a[aria-current=page]{background:rgba(255,255,255,.17);color:#fff}
.nav svg{flex:none;opacity:.9}
.side-foot{margin-top:auto;padding-top:22px}
.side-foot p{font-size:13px;color:rgba(255,255,255,.72);margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.24);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:rgba(255,255,255,.8);font:500 14px/1 var(--font);padding:9px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink)}
.seg.light{background:var(--soft);display:inline-grid;border:1px solid var(--rule)}
.seg.light button{color:var(--ink-2);padding:10px 18px}
.seg.light button[aria-pressed=true]{background:var(--cover);color:#fff}
.saved{display:flex;align-items:center;gap:7px;font-size:12.5px;color:rgba(255,255,255,.66);margin-top:14px}
.saved i{width:7px;height:7px;border-radius:50%;background:#7CE3B1}

.main{min-width:0;background:var(--page) radial-gradient(var(--dot) 1px,transparent 1.4px) 0 0/24px 24px;padding:clamp(28px,5vw,60px) clamp(18px,5vw,68px) 120px}
.wrap{max-width:1060px;margin:0 auto}
.head h1{font-size:clamp(32px,4.3vw,52px);line-height:1.04;letter-spacing:-.028em;font-weight:600;max-width:18ch;text-wrap:balance}
.head .lede{font-size:19px;line-height:1.5;color:var(--ink-2);max-width:58ch;margin-top:16px}
.hello{font-size:15px;color:var(--ink-3);margin-bottom:12px}
.sec{margin-top:clamp(44px,6vw,68px)}
.sec > h2{font-size:27px;line-height:1.15;letter-spacing:-.015em;font-weight:600}
.sec > h2 + p{color:var(--ink-2);max-width:62ch;margin-top:8px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);text-decoration:none;font-size:14.5px;font-weight:500;margin-bottom:22px}
.back:hover{color:var(--ink)}

/* path on the start page */
.path{list-style:none;padding:0;margin-top:20px;background:#fff;border-top:2px solid var(--ink)}
.path li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 6px;border-bottom:1px solid var(--rule)}
.path .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;border:1.5px solid var(--ink);color:var(--ink)}
.path li.done .n{background:var(--good);border-color:var(--good);color:#fff}
.path b{font-weight:600;font-size:18px;line-height:1.25;display:block}
.path em.when{display:block;font-style:normal;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cover);margin-bottom:3px}
.todayskills{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:18px}
.todayskills a{display:flex;flex-direction:column;gap:6px;background:#fff;border:1.5px solid var(--rule);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .12s}
.todayskills a:hover{border-color:var(--cover);transform:translateY(-2px)}
.todayskills small{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.todayskills b{font-weight:600;font-size:19px;line-height:1.2}
.todayskills span{color:var(--ink-2);font-size:14.5px;line-height:1.4}
.todayskills i{font-style:normal;font-weight:600;font-size:14.5px;color:var(--cover);margin-top:auto;padding-top:8px}
.mini li b{color:var(--ink);font-weight:600}
.path span{display:block;color:var(--ink-2);font-size:15px;margin-top:2px}

/* anatomy */
.anatomy{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,44px);margin-top:24px;align-items:start}
.notes{list-style:none;padding:0;display:grid;gap:18px}
.notes li{display:grid;grid-template-columns:30px 1fr;gap:12px}
.notes .k,.sheet .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cover);color:#fff;font:600 12px/1 var(--font)}
.notes b{display:block;font-weight:600}
.notes p{color:var(--ink-2);font-size:15.5px;margin-top:2px}

/* paper sheet with a file on it */
.file{min-width:0}
.file-tab{display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--mono);background:#fff;border:1px solid var(--rule);border-bottom:0;border-radius:6px 6px 0 0;padding:8px 12px;color:var(--ink-2)}
.sheet{background:#fff;border:1px solid var(--rule);border-radius:0 6px 6px 6px;font:400 12.75px/1.7 var(--mono);padding:18px 20px;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:560px;box-shadow:0 22px 44px -32px rgba(22,26,46,.4)}
.sheet .fm{color:var(--accent)}
.sheet .h{font-weight:700}
.sheet mark{background:color-mix(in srgb,var(--cover) 13%,#fff);color:inherit;border-radius:3px;padding:0 2px}
.sheet .k{margin-right:6px;vertical-align:1px}
.sheet.short{max-height:none}

/* library */
.group{margin-top:clamp(40px,5vw,60px)}
.group h2{font-size:25px;line-height:1.15;letter-spacing:-.015em;font-weight:600}
.group > p{color:var(--ink-2);max-width:62ch;margin-top:6px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:34px 24px;margin-top:24px}
.vol{display:block;text-decoration:none;color:inherit;min-width:0}
.book{display:flex;flex-direction:column;aspect-ratio:3/4;border-radius:4px 12px 12px 4px;background:var(--c);color:#fff;position:relative;padding:18px 16px 16px 28px;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 26px -18px color-mix(in srgb,var(--c) 70%,#000)}
.book::before{content:"";position:absolute;inset:0 auto 0 0;width:13px;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(0,0,0,.06))}
.vol:hover .book,.vol:focus-visible .book{transform:translateY(-5px) rotate(-.7deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 26px 30px -20px color-mix(in srgb,var(--c) 70%,#000)}
.book svg.mark{width:46px;height:46px}
.book .t{font-size:21px;line-height:1.1;font-weight:600;letter-spacing:-.01em;margin-top:auto}
.book .for{align-self:flex-start;max-width:100%;margin-top:12px;background:#fff;color:var(--ink);font-size:11.5px;line-height:1.2;font-weight:500;padding:4px 8px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book .got{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center}
.book.blank{background:#fff;color:var(--ink);border:1.5px dashed #B9BFD0;box-shadow:none}
.book.blank::before{display:none}
.vol:hover .book.blank{box-shadow:none;border-color:var(--ink)}
.vol p{font-size:14px;line-height:1.42;color:var(--ink-2);margin-top:13px}
.vol .tag{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:12px}
.vol .tag + p{margin-top:3px}
.shelf.wide{grid-template-columns:repeat(auto-fill,minmax(150px,190px))}

/* a skill's page */
.skill{display:grid;grid-template-columns:minmax(210px,270px) minmax(0,1fr);gap:clamp(26px,5vw,60px);align-items:start}
.skill-side{position:sticky;top:26px}
.skill-side .book{max-width:270px}
.skill-side .book .t{font-size:27px}
.skill-side .book svg.mark{width:58px;height:58px}
.facts dt{font-size:13px;color:var(--ink-3);margin-top:18px}
.facts dd{font-size:15px;line-height:1.45;margin-top:3px}
.facts ul{padding-left:18px;margin:0}
.facts li{margin-top:3px}
.skill-main h1{font-size:clamp(30px,3.8vw,44px);line-height:1.06;letter-spacing:-.025em;font-weight:600;text-wrap:balance}
.skill-main .lede{font-size:18.5px;color:var(--ink-2);margin-top:12px;max-width:56ch}
.tagline{font-size:13.5px;font-weight:600;color:var(--accent);margin-bottom:10px}
.do{list-style:none;padding:0;margin-top:30px;background:#fff;border:1px solid var(--rule);border-radius:16px}
.do > li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:16px;padding:24px 24px 26px;border-bottom:1px solid var(--rule)}
.do > li:last-child{border-bottom:0}
.do .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;border:1.5px solid var(--ink)}
.do > li.done .n{background:var(--good);border-color:var(--good);color:#fff}
.do h2{font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.01em;padding-top:3px}
.do h2 + p,.do .say{color:var(--ink-2);margin-top:6px;max-width:60ch}
.do .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.do details{margin-top:14px}
.do summary{cursor:pointer;font-weight:500;color:var(--ink-2);font-size:15px}
.do summary:hover{color:var(--ink)}
.do details[open] summary{margin-bottom:10px}
.clicks{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;margin-top:14px}
.clicks kbd{font:500 14.5px/1.2 var(--font);background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:6px 11px;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.clicks i{font-style:normal;color:var(--ink-3);padding:0 1px}
.fine{font-size:14px;color:var(--ink-2);margin-top:12px;max-width:62ch}
.copy{position:relative;background:var(--soft);border-radius:10px;padding:14px 16px;margin-top:14px}
.copy pre{margin:0;font:400 13.25px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;padding-right:74px;max-height:260px;overflow:auto}
.copy .btn{position:absolute;top:9px;right:9px;background:#fff;border-color:var(--rule)}
.tick{display:flex;gap:11px;align-items:flex-start;margin-top:16px;cursor:pointer;font-weight:500}
.tick input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;margin:1px 0 0;cursor:pointer;display:grid;place-items:center}
.tick input:checked{background:var(--good);border-color:var(--good)}
.tick input:checked::after{content:"";width:10px;height:6px;border-left:2.2px solid #fff;border-bottom:2.2px solid #fff;transform:translateY(-1px) rotate(-45deg)}
.test{border-top:1px solid var(--rule);margin-top:20px;padding-top:18px}
.test h3{font-size:16.5px;font-weight:600}
.expect{font-size:15px;margin-top:12px;padding-left:14px;border-left:3px solid var(--good);color:var(--ink)}
.expect b{font-weight:600}
.stops{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px}
.stops li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.stops svg{margin-top:3px;color:var(--accent)}

/* write your own */
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);gap:clamp(24px,4vw,48px);align-items:start;margin-top:34px}
.maker-side{position:sticky;top:24px}
.ask{padding:24px 0;border-bottom:1px solid var(--rule)}
.ask:first-child{padding-top:0}
.ask label,.ask .lab{display:block;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.01em}
.ask .hint{color:var(--ink-2);font-size:15px;margin-top:4px;max-width:56ch}
.ask .input,.ask .area{margin-top:12px}
.ask .slug{font-size:13.5px;color:var(--ink-3);margin-top:8px}
.ask .slug code{font:500 13px var(--mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--rule);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px/1.2 var(--font);cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s}
.chip:hover{border-color:#B9BFD0}
.chip[aria-pressed=true]{background:var(--cover);border-color:var(--cover);color:#fff}
.starters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.starters span{font-size:14.5px;color:var(--ink-2);margin-right:4px}
.maker-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:26px}
.count{font-size:13px;color:var(--ink-3);margin-top:10px}
.count b{color:var(--ink-2);font-weight:600}

/* ---------- what a skill is, what is inside, how to change it ---------- */
.what .def{font-size:20px;line-height:1.5;max-width:58ch;margin-top:12px}
.again h3{margin-top:30px}
.what .vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px;max-width:760px}
.what .vs > div{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.what .vs > div.on{border-color:var(--cover);box-shadow:inset 3px 0 0 var(--cover)}
.what .vs b{font-weight:600;font-size:17px}
.what .vs p{color:var(--ink-2);font-size:15px;margin-top:4px}
.what .uses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px;margin-top:20px;max-width:760px}
.what .uses dt{font-weight:600;font-size:15px}
.what .uses dd{color:var(--ink-2);font-size:15px;margin:2px 0 0}
.what .tools{display:grid;gap:6px;margin:12px 0 0;max-width:640px}
.what .tools > div{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:12px;align-items:baseline;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:8px 14px}
.what .tools > div.w{background:#FBF5F4;border-color:#EFD9D5}
.what .tools dt{font:500 13.5px/1.5 var(--mono);overflow-wrap:anywhere}
.what .tools dd{margin:0;color:var(--ink-2);font-size:14.5px}
.made{margin-top:26px;background:#fff;border:1px solid var(--rule);border-radius:16px;padding:22px 24px}
.made h2{font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.made > p{color:var(--ink-2);font-size:15px;margin-top:4px;max-width:62ch}
.made dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px;margin:18px 0 0}
.made dt{font-size:13px;font-weight:600;color:var(--accent)}

const REAL = {"market-sizing": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-market-research/skills/market-sizing", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-market-research/skills/market-sizing", "files": {"SKILL.md": "---\nname: market-sizing\ndescription: \"Estimate market size using TAM, SAM, and SOM with top-down and bottom-up approaches. Use when sizing a market opportunity, estimating addressable market, preparing for investor pitches, or evaluating market entry.\"\n---\n\n# Estimate Market Size (TAM, SAM, SOM)\n\n## Purpose\nEstimate the Total Addressable Market (TAM), Serviceable Addressable Market (SAM), and Serviceable Obtainable Market (SOM) for a product. Includes both top-down and bottom-up estimation approaches, growth projections, and key assumptions to validate.\n\n## Instructions\n\nYou are a strategic market analyst specializing in market sizing, opportunity assessment, and growth forecasting.\n\n### Input\nYour task is to estimate the market size for **$ARGUMENTS** within the specified market constraints (geography, industry vertical, customer type, etc.).\n\nIf the user provides market research, industry reports, financial data, or competitor information, read and analyze them directly. Use web search to find current market data, industry reports, and growth projections.\n\n### Analysis Steps (Think Step by Step)\n\n1. **Market Definition**: Define the market boundaries — what problem space, which customer segments, what geography or constraints apply\n2. **Top-Down Estimation**: Start from total industry size and narrow to the relevant slice\n3. **Bottom-Up Estimation**: Build from unit economics (customers × price × frequency) to cross-validate\n4. **SAM Scoping**: Identify which portion of TAM is realistically serviceable given product capabilities, channels, and constraints\n5. **SOM Estimation**: Estimate achievable share in the next 1-3 years based on competitive position and go-to-market capacity\n6. **Growth Projection**: Forecast how TAM, SAM, and SOM may evolve over the next 2-3 years\n7. **Assumption Mapping**: Surface the key assumptions underlying each estimate\n\n### Output Structure\n\n**Market Definition**\n- Problem space and customer need\n- Geographic and segment boundaries\n- Key constraints or scoping decisions\n\n**TAM (Total Addressable Market)**\n- Top-down estimate with sources and reasoning\n- Bottom-up estimate for cross-validation\n- Reconciliation of the two approaches\n- Current TAM value (annual revenue opportunity)\n\n**SAM (Serviceable Addressable Market)**\n- Which portion of TAM the product can realistically serve\n- Constraints: geography, language, channels, product capabilities, pricing tier\n- SAM as percentage of TAM with reasoning\n\n**SOM (Serviceable Obtainable Market)**\n- Realistic share achievable in 1-3 years\n- Basis: competitive position, go-to-market capacity, current traction\n- SOM as percentage of SAM with reasoning\n\n**Market Summary Table**\n\n| Metric | Current Estimate | 2-3 Year Projection |\n|--------|-----------------|---------------------|\n| TAM    |                 |                     |\n| SAM    |                 |                     |\n| SOM    |                 |                     |\n\n**Growth Drivers & Trends**\n- Key factors that could expand or contract the market\n- Technology, regulatory, demographic, or behavioral shifts\n- Emerging segments or adjacent markets\n\n**Key Assumptions & Risks**\n- Critical assumptions behind each estimate (numbered)\n- Confidence level for each (high / medium / low)\n- How to validate the most uncertain assumptions\n- What would materially change the estimates\n\n## Best Practices\n\n- Always provide both top-down and bottom-up estimates to triangulate\n- Use web search for current industry data, analyst reports, and market benchmarks\n- Cite sources for market data — avoid unsupported numbers\n- Be explicit about assumptions; label estimates vs. data\n- Distinguish between value-based (revenue) and volume-based (users/units) sizing\n- Consider currency and purchasing power parity for international markets\n- Flag where estimates have wide confidence intervals\n- Recommend specific data sources or research to sharpen estimates\n\n---\n\n### Further Reading\n\n- [Market Research: Advanced Techniques](https://www.productcompass.pm/p/market-research-advanced-techniques)\n- [User Interviews: The Ultimate Guide to Research Interviews](https://www.productcompass.pm/p/interviewing-customers-the-ultimate)\n- [Crossing the Chasm: The Ultimate Guide For PMs](https://www.productcompass.pm/p/crossing-the-chasm)\n- [Product Innovation Masterclass](https://www.productcompass.pm/p/product-innovation-masterclass) (video course)\n"}}, "competitor-analysis": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-market-research/skills/competitor-analysis", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-market-research/skills/competitor-analysis", "files": {"SKILL.md": "---\nname: competitor-analysis\ndescription: \"Analyze competitors with strengths, weaknesses, and differentiation opportunities. Identifies direct competitors and maps the competitive landscape. Use when doing competitive research, preparing a competitive brief, or finding differentiation opportunities.\"\n---\n\n# Competitor Analysis\n\n## Purpose\nConduct a comprehensive competitive analysis to understand the landscape, identify 5 direct competitors, and uncover differentiation opportunities. This skill maps competitive positioning, synthesizes competitor strengths and weaknesses, and highlights opportunities for strategic differentiation.\n\n## Instructions\n\nYou are a strategic product analyst and competitive intelligence expert specializing in competitive positioning and market landscape mapping.\n\n### Input\nYour task is to analyze the competitive landscape for **$ARGUMENTS** in the **[market/industry segment]** (if specified).\n\nConduct web research to identify direct competitors. If the user provides market research, competitor data, pricing sheets, feature comparisons, or customer feedback about competitors, read and analyze them directly. Synthesize data into a comprehensive competitive view.\n\n### Analysis Steps (Think Step by Step)\n\n1. **Market Scoping**: Define the market, industry, and addressable customer base for $ARGUMENTS\n2. **Competitor Identification**: Use web search to identify 5 primary direct competitors\n3. **Competitive Intelligence**: Research each competitor's positioning, features, pricing, go-to-market strategy\n4. **Strengths & Weaknesses**: Assess competitor capabilities, limitations, and market positioning\n5. **Differentiation Mapping**: Identify gaps, overlaps, and opportunities for $ARGUMENTS to differentiate\n6. **Strategic Synthesis**: Develop insights about competitive dynamics and future threats\n\n### Output Structure\n\n**Market Overview & Definition**\n- Market size and growth trends\n- Primary customer segments and use cases\n- Key success factors in this market\n- Market dynamics and competitive intensity\n\n**Competitive Set Summary**\n- 5 primary direct competitors identified\n- Market positions: leaders, challengers, niche players\n- Estimated market share or positioning\n- Notable adjacent or indirect competitors\n\nFor each of the 5 competitors:\n\n**Competitor Profile**\n- Company name, founding date, funding/status\n- Primary market focus and customer segments served\n- Estimated market share or customer base size\n- Market positioning and go-to-market strategy\n\n**Core Product Strengths**\n- Key features and capabilities\n- Unique competitive advantages\n- Customer value proposition\n- Technology differentiation or moats\n- Customer satisfaction and retention signals\n\n**Product Weaknesses & Gaps**\n- Missing features or use cases\n- Known limitations or pain points for customers\n- Technical or operational weaknesses\n- Market positioning gaps\n- Customer dissatisfaction areas\n\n**Business Model & Pricing**\n- Pricing structure (per-seat, per-usage, flat-fee, freemium, etc.)\n- Price point(s) in market\n- Go-to-market channels and sales motion\n- Revenue model and growth stage\n\n**Competitive Threats & Advantages**\n- How this competitor threatens $ARGUMENTS\n- Existing customer base and switching costs\n- Strategic partnerships or ecosystems\n- Recent product updates or strategic moves\n\n**Differentiation Opportunities for $ARGUMENTS**\n\n- Unmet customer needs across competitive set\n- Feature/pricing/UX opportunities to stand out\n- Target segments underserved by competitors\n- Jobs-to-be-done not effectively solved by competitors\n- Channel or go-to-market approaches not yet deployed\n- Potential partnerships or integrations competitors lack\n\n**Competitive Positioning Recommendation**\n- Recommended competitive positioning for $ARGUMENTS\n- Key differentiators to emphasize\n- Segments or use cases to target or avoid\n- Competitive threats to monitor\n- 12-18 month competitive risks and opportunities\n\n## Best Practices\n\n- Research current competitor websites, pricing pages, and customer reviews\n- Use web search to identify product launches, funding, executive moves\n- Distinguish between direct competitors and adjacent alternatives\n- Validate competitive insights across multiple sources\n- Identify both obvious and subtle differentiation opportunities\n- Consider customer pain points not yet addressed in market\n- Look for emerging competitors or new market entrants\n- Flag competitors gaining traction or gaining market share\n- Consider long-term competitive dynamics and market shifts\n\n---\n\n### Further Reading\n\n- [Market Research: Advanced Techniques](https://www.productcompass.pm/p/market-research-advanced-techniques)\n- [User Interviews: The Ultimate Guide to Research Interviews](https://www.productcompass.pm/p/interviewing-customers-the-ultimate)\n"}}, "beachhead-segment": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-go-to-market/skills/beachhead-segment", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-go-to-market/skills/beachhead-segment", "files": {"SKILL.md": "---\nname: beachhead-segment\ndescription: \"Identify the first beachhead market segment for a product launch. Evaluates segments against burning pain, willingness to pay, winnable market share, and referral potential. Use when choosing a first market, targeting an initial customer segment, or planning market entry strategy.\"\n---\n# Beachhead Segment\n\n## Overview\nIdentify the first beachhead market segment for product launch. This skill evaluates potential market segments against key criteria to find your initial winning segment that enables fast PMF validation and adjacent expansion.\n\n## When to Use\n- Choosing a first market for your product\n- Targeting an initial customer segment\n- Planning initial market entry strategy\n- Deciding where to focus limited resources\n- Validating GTM assumptions with early adopters\n\n## Key Evaluation Criteria\n\n### 1. Burning Pain Point\nDoes this segment experience an acute, unmet problem?\n- Daily frustration with the status quo\n- Significant productivity loss or cost impact\n- Emotional urgency to find a solution\n- Current workarounds are expensive or fragile\n- Problem is getting worse over time\n\n### 2. Willingness to Pay\nDoes this segment have budget and motivation to pay for a solution?\n- Documented budget allocation for this problem area\n- ROI is clear and compelling (value > cost)\n- Economic impact of problem justifies solution cost\n- Decision-maker has autonomy or influence over budget\n- No free or DIY alternatives that fully satisfy need\n\n### 3. Winnable Market Share\nCan you realistically capture 60-70% of this segment in 3-18 months?\n- Segment is large enough but not oversaturated\n- Limited competition or easy differentiation\n- Market players are fragmented or complacent\n- Your product has clear competitive advantage\n- You have unique access or distribution advantage\n\n### 4. Referral Potential\nWill customers naturally refer or recommend to others?\n- Segment contains professional communities\n- Customers interact with adjacent segments (expansion opportunity)\n- High word-of-mouth culture in this industry\n- Network effects within the segment\n- Solving problem for one creates demand in adjacent segments\n\n## How It Works\n\n### Step 1: List Potential Segments\nBrainstorm all possible target segments:\n- Industry verticals (SaaS, healthcare, manufacturing, etc.)\n- Company size (SMB, mid-market, enterprise)\n- Job titles or roles\n- Geographic regions\n- Use cases or use-case variations\n- Customer maturity level\n\n### Step 2: Research Pain Points\nValidate burning pain in each segment:\n- Customer interviews and discovery calls\n- Problem validation through surveys\n- Market research and analyst reports\n- Competitor positioning and customer reviews\n- Quantify cost/impact of the problem\n- Identify current workarounds and limitations\n\n### Step 3: Assess Willingness to Pay\nDetermine budget and economic viability:\n- Segment's budget for this problem category\n- ROI calculation (value gained vs cost)\n- Current spending on solutions or workarounds\n- Budget decision-making process\n- Typical deal size expectations\n- Pricing sensitivity in the segment\n\n### Step 4: Evaluate Winnability\nAssess realistic market share potential:\n- Total addressable market (TAM) size\n- Competitive landscape and positioning\n- Your differentiation or unfair advantage\n- Distribution access to this segment\n- Time and resources required\n- Market growth and momentum\n\n### Step 5: Identify Referral Pathways\nMap expansion opportunities:\n- Adjacent segments that reference segment influences\n- Network effects within the segment\n- Professional communities and associations\n- Customer-to-customer recommendations\n- Natural expansion path to adjacent markets\n- Viral or network effects from solving core pain\n\n### Step 6: Select Beachhead\nChoose your primary launch segment:\n- Highest combined score across four criteria\n- Most achievable for your current resources\n- Shortest path to PMF and revenue\n- Best reference for adjacent expansion\n- Most enthusiastic early customer cohort\n\n## Input Format\nUse $ARGUMENTS to pass:\n- Product description and capabilities\n- Initial market research and validation data\n- Potential segment options\n- Constraints and limitations\n- Timeline and resource constraints\n- Current customer data or feedback\n\n## Output\nA beachhead segment analysis including:\n- Top 3-5 recommended segments with scoring\n- Primary beachhead segment recommendation\n- Pain point validation and evidence\n- Willingness to pay assessment and pricing guidance\n- Realistic market share and revenue projections\n- Referral and expansion pathways to adjacent segments\n- 90-day customer acquisition plan for beachhead\n- Post-beachhead expansion roadmap\n\n## Framework\nBased on Geoffrey Moore's beachhead market strategy in \"Crossing the Chasm.\" Focuses on finding the smallest winnable, referenceable market that validates PMF and enables expansion.\n\n## Tips\n- Start absurdly specific. A niche beachhead is better than a vague mass market\n- Choose the segment most likely to evangelize your solution\n- Validate all four criteria with at least 10 customer interviews\n- Select segment with fastest path to revenue and references\n- Ensure beachhead can reference to adjacent market segments\n- Focus all resources on dominating the beachhead (not diluting efforts)\n- Plan exit from beachhead only after 60%+ market share\n\n---\n\n### Further Reading\n\n- [5 GTM Principles You Should Know as a PM](https://www.productcompass.pm/p/5-gtm-principles-with-frameworks-templates)\n- [Product-Led Growth 101, Part 1/2](https://www.productcompass.pm/p/product-led-growth-101-12)\n- [How to Design a Value Proposition Customers Can't Resist?](https://www.productcompass.pm/p/how-to-design-value-proposition-template)\n- [How to Achieve Product-Market Fit? Part I: Market and Value Proposition](https://www.productcompass.pm/p/how-to-achieve-the-product-market)\n"}}, "identify-assumptions-new": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-product-discovery/skills/identify-assumptions-new", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-product-discovery/skills/identify-assumptions-new", "files": {"SKILL.md": "---\nname: identify-assumptions-new\ndescription: \"Identify risky assumptions for a new product idea across 8 risk categories including Go-to-Market, Strategy, and Team. Use when evaluating startup risks, assessing a new product concept, or mapping assumptions for a new venture.\"\n---\n\n## Identify Assumptions (New Product)\n\nComprehensive risk identification across 8 categories — extending the 4 core product risks (Teresa Torres, *Continuous Discovery Habits*) with Ethics, Go-to-Market, Strategy & Objectives, and Team risks that are critical for new products.\n\n### Context\n\nYou are evaluating assumptions for a new product: **$ARGUMENTS**.\n\nIf the user provides files (business plans, research), read them first.\n\n### Domain Context\n\n**The 4 core product risks** (Teresa Torres, *Continuous Discovery Habits*): Value, Usability, Viability, Feasibility.\n\n**For new products, extend to 8 risk categories.** Good teams assume at least three-quarters of their ideas won't perform as they hope.\n\n### Instructions\n\nThe user will describe the product concept, target segment, and feature idea. Work through these steps:\n\n1. **Think from three perspectives** about why this product might fail:\n   - **Product Manager**: Market demand, willingness to pay, competitive landscape\n   - **Designer**: First-time user experience, onboarding, engagement\n   - **Engineer**: Build vs. buy decisions, scalability, technical debt\n\n2. **Identify assumptions across 8 risk categories**:\n\n   - **Value**: Will it create value for customers? Will they keep using it?\n   - **Usability**: Will people figure out how to use it? Can we onboard them fast enough? Will it increase cognitive load?\n   - **Viability**: Can we sell/monetize/finance it? Is it worth the cost? Can we support customers and help them succeed? Can we scale? Will it be compliant?\n   - **Feasibility**: Can we do it with the current technology? Is this integration possible? Can it be efficient? Can we scale it?\n   - **Ethics**: Should we do it at all? Are there any ethical considerations? Will it pose a risk for our customers?\n   - **Go-to-Market** (especially critical for new products): Can we market it? Do we have the required channels? Can we convince customers to try it? Is this the right messaging for this channel? Is this the right time? Is this the right way to launch it?\n   - **Strategy & Objectives**: What are our assumptions? Can others copy our strategy? Have we considered political, economic, legal, technological, and environmental factors? Are those the best problems to solve?\n   - **Team**: How well will the team work together? Do we have the right people? Do we have the right tools? Will the entire team stay with us long enough?\n\n3. **For each assumption**, rate confidence and suggest a test.\n\nThink step by step. Save as markdown.\n\n---\n\n### Further Reading\n\n- [Assumption Prioritization Canvas: How to Identify And Test The Right Assumptions](https://www.productcompass.pm/p/assumption-prioritization-canvas)\n- [What Is Product Discovery? The Ultimate Guide Step-by-Step](https://www.productcompass.pm/p/what-exactly-is-product-discovery)\n- [Continuous Product Discovery Masterclass (CPDM)](https://www.productcompass.pm/p/cpdm) (video course)\n"}}, "interview-script": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-product-discovery/skills/interview-script", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-product-discovery/skills/interview-script", "files": {"SKILL.md": "---\nname: interview-script\ndescription: \"Create a structured customer interview script with JTBD probing questions, warm-up, core exploration, and wrap-up sections. Follows The Mom Test principles — no leading questions, no pitching, focus on past behavior. Use when preparing for user interviews, creating interview guides, or planning discovery research.\"\n---\n\n## Customer Interview Script\n\nCreate a structured interview script that surfaces real insights, not just opinions. Follows \"The Mom Test\" principles — ask about their life, not your idea.\n\n### Domain Context\n\nCustomer interviews are one source in **Stage 1 (Explore)** of continuous discovery. Other sources: stakeholder interviews, usage analytics, data analytics, surveys, market trends, SEO/SEM analysis. The PM needs direct access to users, stakeholders, engineers, and designers — \"without proxies.\" The **Product Trio** (PM + Designer + Engineer — Teresa Torres) should work together on discovery, not just the PM alone.\n\n### Context\n\nYou are preparing a customer interview script for research on **$ARGUMENTS**.\n\nIf the user provides files (personas, hypothesis lists, product briefs, or previous interview notes), read them first.\n\n### Instructions\n\n1. **Clarify research objectives**:\n   - What specific questions does the team need answered?\n   - What decisions will this research inform?\n   - What assumptions need validation?\n\n2. **Create the interview script** with these sections:\n\n   ### Opening (2-3 min)\n   - Introduce yourself and the purpose (learning, not selling)\n   - Set expectations: \"There are no right or wrong answers. We're here to learn from your experience.\"\n   - Ask permission to record (if applicable)\n   - Confirm time available\n\n   ### Warm-Up: Context & Background (5 min)\n   - \"Tell me about your role and what a typical day/week looks like.\"\n   - \"How long have you been doing [activity related to the product area]?\"\n   - Goal: Build rapport and understand their context\n\n   ### Core Exploration: Jobs to Be Done (15-20 min)\n\n   **Current situation and behavior** (past tense, specific instances):\n   - \"Walk me through the last time you [did the thing we're exploring]. What happened?\"\n   - \"What tools or methods did you use?\"\n   - \"How long did it take? Who else was involved?\"\n\n   **Pain points and frustrations** (observe, don't lead):\n   - \"What was the hardest part about that?\"\n   - \"If you could wave a magic wand, what would change?\"\n   - \"What have you tried to solve this? What happened?\"\n\n   **Desired outcomes** (their words, not yours):\n   - \"What does 'good' look like for you in this area?\"\n   - \"How would you know if this was working well?\"\n\n   **Willingness to pay / priority** (skin in the game):\n   - \"How much time/money do you currently spend on this?\"\n   - \"Have you looked for a better solution? What did you find?\"\n   - \"What would you give up to have this solved?\"\n\n   ### Probing Techniques\n   Use these when you hit an interesting thread:\n   - **\"Tell me more about that\"** — opens up any topic\n   - **\"Why?\"** (asked gently, 2-3 times) — gets to root causes\n   - **\"Can you give me a specific example?\"** — moves from opinions to facts\n   - **\"What happened next?\"** — follows the story\n   - **\"How did that make you feel?\"** — captures emotional intensity\n\n   ### The Mom Test Rules\n   - Ask about **their life**, not your idea\n   - Ask about **the past**, not the future (\"Would you use X?\" is useless)\n   - **Talk less, listen more** — aim for 80/20 split\n   - **Never pitch** during the interview\n   - Look for **strong emotions** — they signal real pain or delight\n   - **Compliments are noise** — \"That sounds cool!\" tells you nothing\n\n   ### Wrap-Up (3-5 min)\n   - \"Is there anything I didn't ask that you think is important?\"\n   - \"Who else should I talk to about this?\"\n   - Thank them for their time\n   - Share next steps (if any)\n\n3. **Customize the script**: Adapt questions to the specific product area, persona, and research objectives. Add or remove sections based on the interview length available.\n\n4. **Include a note-taking template**:\n   ```\n   Participant: [Name / ID]\n   Date: [Date]\n   Key Jobs: [What they're trying to accomplish]\n   Current Solution: [What they use today]\n   Biggest Pain: [Their #1 frustration]\n   Desired Outcome: [What success looks like]\n   Willingness to Pay: [How much they invest / would invest]\n   Surprise Finding: [Something unexpected]\n   Follow-up: [Next steps]\n   ```\n\nSave as markdown. Include both the script and the note-taking template.\n\n---\n\n### Further Reading\n\n- [User Interviews: The Ultimate Guide to Research Interviews](https://www.productcompass.pm/p/interviewing-customers-the-ultimate)\n- [Continuous Product Discovery Masterclass (CPDM)](https://www.productcompass.pm/p/cpdm) (video course)\n"}}, "summarize-interview": {"author": "Paweł Huryn", "license": "MIT", "repo": "phuryn/pm-skills", "path": "pm-product-discovery/skills/summarize-interview", "commit": "8607e3b077817f89bf4a9b623246219734ac3be0", "url": "https://github.com/phuryn/pm-skills/tree/8607e3b077817f89bf4a9b623246219734ac3be0/pm-product-discovery/skills/summarize-interview", "files": {"SKILL.md": "---\nname: summarize-interview\ndescription: \"Summarize a customer interview transcript into a structured template with JTBD, satisfaction signals, and action items. Use when processing interview recordings or transcripts, synthesizing discovery interviews, or creating interview summaries.\"\n---\n\n## Summarize Customer Interview\n\nTransform an interview transcript into a structured summary focused on Jobs to Be Done, satisfaction, and action items.\n\n### Context\n\nYou are summarizing a customer interview for the product discovery of **$ARGUMENTS**.\n\nThe user will provide an interview transcript — either as an attached file (text, PDF, audio transcription) or pasted directly. Read any attached files first.\n\n### Instructions\n\n1. **Read the full transcript** carefully before summarizing.\n\n2. **Fill in the summary template** below. Use \"-\" if information is unavailable. Replace numeric values with qualitative descriptions if needed (e.g., \"not satisfied\").\n\n3. **Use clear, simple language** — a primary school graduate should be able to understand the summary.\n\n### Output Template\n\n```\n**Date**: [Date and time of the interview]\n**Participants**: [Full names and roles]\n**Background**: [Background information about the customer]\n\n**Current Solution**: [What solution they currently use]\n\n**What They Like About Current Solution**:\n- [Job to be done, desired outcome, importance, and satisfaction level]\n\n**Problems With Current Solution**:\n- [Job to be done, desired outcome, importance, and satisfaction level]\n\n**Key Insights**:\n- [Unexpected findings or notable quotes]\n\n**Action Items**:\n- [Date, Owner, Action — e.g., \"2025-01-15, Paweł Huryn, Follow up with customer about pricing\"]\n```\n\nSave the summary as a markdown document in the user's workspace.\n\n---\n\n### Further Reading\n\n- [User Interviews: The Ultimate Guide to Research Interviews](https://www.productcompass.pm/p/interviewing-customers-the-ultimate)\n- [Continuous Product Discovery Masterclass (CPDM)](https://www.productcompass.pm/p/cpdm) (video course)\n"}}, "interview-synthesis": {"author": "Mohit Aggarwal", "license": "MIT", "repo": "mohitagw15856/pm-claude-skills", "path": "skills/interview-synthesis", "commit": "d11af08fd758f1d25e98b16b08a4d99cea54b980", "url": "https://github.com/mohitagw15856/pm-claude-skills/tree/d11af08fd758f1d25e98b16b08a4d99cea54b980/skills/interview-synthesis", "files": {"SKILL.md": "---\nname: interview-synthesis\ndescription: \"Turn a pile of interview notes into findings that survive scrutiny — the code-then-theme pass, the counting discipline (how many actually said it), the quote selection that illustrates instead of cherry-picks, and the confidence lines a small sample earns. Use when asked synthesize these user/customer/exit interviews, what did we actually learn from the calls, turn 12 transcripts into insights, or are these themes real. Produces the coded themes with counts, the divergences preserved, the illustrative quotes, and the claims sized to the sample.\"\n---\n\n# Interview Synthesis Skill\n\nInterview piles get \"synthesized\" two bad ways: the highlight reel (the quotes that confirmed what the team hoped) and the mush (\"users want simplicity\" — twelve hours of conversation flattened into a poster). Honest synthesis is mechanical before it's interpretive: code the notes (what did each person actually say, tagged), count the themes (a theme is something *multiple* people said — with the number attached), preserve the divergences (the two dissenters are data, not noise), and size every claim to the sample — twelve interviews support \"we repeatedly heard,\" never \"users want.\"\n\n## What This Skill Produces\n\n- **The coded pass** — each interview's statements tagged to emerging codes, traceable back to the speaker\n- **The theme table** — themes with counts (7/12 raised unprompted; 3 more agreed when asked — the prompted/unprompted split matters)\n- **The divergence report** — who disagreed with each theme and why; the outliers examined, not deleted\n- **The claims, sample-sized** — findings phrased at what N interviews can carry, with the quotes that illustrate honestly\n\n## Required Inputs\n\nAsk for these if not provided:\n- **The notes/transcripts** — the actual material; synthesis of summaries synthesizes the summarizer's biases\n- **The questions the interviews served** — what the study was trying to learn; themes get organized against them (plus the \"unexpected\" bucket, often the best one)\n- **The sample's shape** — who these people are, how selected (12 enthusiastic volunteers ≠ 12 representative users — the selection shapes what claims are legal)\n- **What the team already believes** — stated up front as hypotheses; the synthesis marks confirms/contradicts explicitly (the contradicts are the expensive-to-lose ones)\n\n## Framework: The Synthesis Rules\n\n1. **Code before theming:** pass one is mechanical — each substantive statement tagged (needs-integration, pricing-confusion, workaround-X) with speaker attribution. Themes emerge from tag frequencies, not from memory — memory promotes the vivid, and vividness isn't prevalence.\n2. **Count, and split prompted from unprompted:** every theme carries its number (\"8/12\"), and *unprompted mentions outweigh prompted agreements* — \"seven raised pricing before we asked\" is a finding; \"everyone agreed pricing matters when asked\" is politeness. The counts keep the highlight reel honest.\n3. **Divergence is data:** the two who disagreed get examined — different segment? Different workflow? Their *why* often reveals the theme's boundary condition (\"the theme holds for teams over ten; both dissenters were solo\"). Deleting outliers manufactures consensus; bounding themes with them manufactures insight.\n4. **Quotes illustrate counted themes — never substitute for them:** each theme gets 1–2 verbatim quotes chosen for *representativeness* (the middle of the distribution, not the spiciest take), attributed at the agreed anonymity level. A vivid quote for a 2/12 theme is cherry-picking with production values.\n5. **Size claims to the sample and selection:** twelve interviews earn \"a recurring pattern among [who we talked to]\" — not \"users want,\" not percentages (\"58% of users\" from n=12 is numerical cosplay). The confidence line states sample, selection, and what would harden the finding (\"survey to size it\" — the [survey-design-basics](../survey-design-basics/SKILL.md) handoff).\n\n## Output Format\n\n# Interview Synthesis: [study] — n=[N], [who/how selected]\n\n## Theme Table\n| Theme | Unprompted / prompted | Count | Bounded by (divergences) |\n|---|---|---|---|\n\n## The Themes (each)\n**[Theme]** (n/N unprompted) — [two sentences of what it actually is] · *\"[representative quote]\"* · Divergence: [who + why + the boundary it suggests]\n\n## Against the Hypotheses\n[Confirmed: … · Contradicted: … — marked plainly]\n\n## Claims & Confidence\n[Findings phrased at sample-legal strength · the selection caveat · what would harden each]\n\n## Quality Checks\n\n- [ ] Every theme traces to coded statements with counts\n- [ ] Unprompted and prompted mentions are distinguished\n- [ ] Divergences are examined for boundaries, not discarded\n- [ ] Quotes are representative of counted themes, not highlights\n- [ ] No claim exceeds what n and selection legally support\n\n## Anti-Patterns\n\n- [ ] Do not synthesize from memory — the vivid interview colonizes the findings; coding is the antidote\n- [ ] Do not present percentages from small samples — counts, plainly\n- [ ] Do not delete the dissenters — they're the theme's boundary survey team\n- [ ] Do not quote the spiciest take as the finding — representative or labeled as an outlier\n- [ ] Do not let confirmation win silently — the contradicted hypotheses are the synthesis's most valuable line\n"}}};

let storageOK = true;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return adopt(JSON.parse(raw));
  } catch (e) { storageOK = false; }
  return fresh();
}
function adopt(d) {
  const f = fresh();
  const s = Object.assign(f, d || {});
  s.venture = Object.assign(fresh().venture, (d && d.venture) || {});
  if (!MANUAL[s.app]) s.app = 'chatgpt';
  if (!COVERS.some(c => c.id === s.cover)) s.cover = 'navy';
  if (!Array.isArray(s.custom)) s.custom = [];
  if (!s.shelf || typeof s.shelf !== 'object') s.shelf = {};
  s.brief = Object.assign(fresh().brief, (d && d.brief) || {});
  s.s1 = Object.assign(fresh().s1, (d && d.s1) || {});
  if (!s.s1.done || typeof s.s1.done !== 'object') s.s1.done = {};
  s.s2 = Object.assign(fresh().s2, (d && d.s2) || {});
  if (!s.s2.done || typeof s.s2.done !== 'object') s.s2.done = {};
  s.s3 = Object.assign(fresh().s3, (d && d.s3) || {});
  if (!s.s3.done || typeof s.s3.done !== 'object') s.s3.done = {};
  if (!s.s3.runs || typeof s.s3.runs !== 'object') s.s3.runs = {};
  s.s4 = Object.assign(fresh().s4, (d && d.s4) || {});
  if (!s.s4.done || typeof s.s4.done !== 'object') s.s4.done = {};
  if (!s.s4.trust || typeof s.s4.trust !== 'object') s.s4.trust = {};
  if (!Array.isArray(s.log)) s.log = [];
  return s;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) { /* nothing more to try */ }
    ta.remove(); return ok;
  }

  const a = document.createElement('a');

/* ---------- a zip file, written by hand (stored, not compressed) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipBytes(files) {
  const enc = new TextEncoder(), now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = []; let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.path), data = enc.encode(f.text || ''), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(38, f.path.endsWith('/') ? 0x10 : 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return [...parts, ...central, new Uint8Array(end.buffer)];
}
/* A skill's folder as zip entries. A real skill keeps every file its author shipped. */
function skillFiles(k) {
  if (!k.real) return [{ path: 'SKILL.md', text: skillMd(k) }];
  return Object.keys(k.files).map(f => ({ path: f, text: f === 'SKILL.md' ? skillMd(k) : k.files[f] }));
}
function skillZip(k) {
  const files = skillFiles(k), dirs = [k.id + '/'];
  files.forEach(f => { const i = f.path.lastIndexOf('/'); if (i > 0 && !dirs.includes(k.id + '/' + f.path.slice(0, i + 1))) dirs.push(k.id + '/' + f.path.slice(0, i + 1)); });
  return zipBytes(dirs.map(d => ({ path: d })).concat(files.map(f => ({ path: k.id + '/' + f.path, text: f.text }))));

/* A published skill, part by part: select a part to see where it sits in the author's file */
let partNotes = {};

  const extra = Object.keys(k.files).filter(f => f !== 'SKILL.md');
  const called = t => t === 'when' ? `Here it is ${k.desc.length} characters long.` : heads[t] ? 'This author calls it ' + heads[t].slice(0, 3).map(h => '"' + esc(h) + '"').join(', ') + '.' : '';

}

            : `<p>A skill earns your trust when it keeps its rules under pressure. Send each test in a new chat. Your AI may also look at your memory and past chats: a new chat is not a blank slate, so the tests ask for things that exist nowhere.</p>

        </div></li>
